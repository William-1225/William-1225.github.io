function renderTrendSubPopHtml(g, subKeys, last, colorOf){
  const allOn = subKeys.length>0 && subKeys.every(k=>TREND_SELECTED.has(k));
  const allItem = `<div class="opt ${allOn?'sel':''}" data-tsub="__all__" data-parent="${g}"><span class="check"></span><span class="nm">全部子品牌</span></div>`;
  const items = subKeys.map(k=>{
    const s = k.split(':')[2];
    const on = TREND_SELECTED.has(k);
    const dot = `<span class="dot" style="width:9px;height:9px;border-radius:2.5px;background:${on?colorOf(k):'#d1d5da'};flex-shrink:0"></span>`;
    return `<div class="opt ${on?'sel':''}" data-tsub="${k}" data-parent="${g}"><span class="check"></span>${dot}<span class="nm">${s}</span></div>`;
  }).join('');
  return `<div class="sub-pop">${allItem}${items}</div>`;
}

function bindTrendHandlers(groupKeys){
  const root = document.getElementById('trendChips');
  root.querySelectorAll('[data-tquick]').forEach(c=>c.onclick=ev=>{
    ev.stopPropagation();
    const kind = c.dataset.tquick;
    if(TREND_QUICK===kind){
      TREND_SELECTED = new Set();
      TREND_QUICK = null;
    } else {
      TREND_SELECTED = trendQuickSelection(kind, groupKeys);
      TREND_QUICK = kind;
    }
    renderTrend();
  });
  root.querySelectorAll('[data-tb]').forEach(c=>c.onclick=ev=>{
    ev.stopPropagation();
    if(ev.target.closest('[data-toggle]')){
      root.querySelectorAll('.opt.has-sub.expanded').forEach(x=>{ if(x!==c) x.classList.remove('expanded'); });
      c.classList.toggle('expanded');
      if(c.classList.contains('expanded')){
        const toggleBtn = c.querySelector('[data-toggle]');
        const subPop = c.querySelector('.sub-pop');
        if(toggleBtn && subPop){
          const r = toggleBtn.getBoundingClientRect();
          subPop.style.left = (r.right + 6) + 'px';
          subPop.style.top = r.top + 'px';
          requestAnimationFrame(()=>{
            const h = subPop.offsetHeight;
            const maxTop = window.innerHeight - h - 8;
            if(r.top > maxTop) subPop.style.top = Math.max(8, maxTop) + 'px';
          });
        }
      }
      return;
    }
    const subEl = ev.target.closest('[data-tsub]');
    if(subEl){
      const g = subEl.dataset.parent;
      const subKeys = GROUP_SUBS[g].map(s=>trendSubKey(g,s));
      const sk = subEl.dataset.tsub;
      if(sk==='__all__'){
        const allOn = subKeys.every(k=>TREND_SELECTED.has(k));
        for(const k of subKeys) allOn ? TREND_SELECTED.delete(k) : TREND_SELECTED.add(k);
      } else if(TREND_SELECTED.has(sk)) TREND_SELECTED.delete(sk);
      else TREND_SELECTED.add(sk);
      TREND_QUICK = null;
      renderTrend();
      return;
    }
    const k = c.dataset.tb;
    if(TREND_SELECTED.has(k)) TREND_SELECTED.delete(k);
    else TREND_SELECTED.add(k);
    TREND_QUICK = null;
    renderTrend();
  });
}

// 把简称省名映射到 GeoJSON 全称（与 renderMap 同一份候选列表）
function fullProvNames(short){

async function renderProvMap(){
  // 确保 china geojson 已注册 (renderMap 里已加载过则跳过)
  if(!mapLoaded){
    provMapChart.showLoading();
    try{
      const r = await fetch(CN_GEO);
      echarts.registerMap('china', await r.json());
      mapLoaded = true;
    }catch(e){
      provMapChart.hideLoading();
      document.getElementById('provMapChart').innerHTML =
        `<div class="err">地图数据加载失败: ${e.message}</div>`;
      return;
    }
    provMapChart.hideLoading();
  }

  // 取当期 + 对比期，按省统计 (location 维度, 去重)
  const subFilter = (l) => {
    if(!ACTIVE_BRAND) return false;
    if(l.g !== ACTIVE_BRAND) return false;
    if(GROUP_SUBS[ACTIVE_BRAND] && SUB_CHECKED){
      return [...l.subs].some(s => SUB_CHECKED.has(s));
    }
    return true;
  };
  // 每省 Map(去重键 → location 对象), 去重键与地图/表格计数完全一致(名称||地址)
  const buildProvLocs = (snap) => {
    if(!snap) return {};
    const locs = buildLocations(filterGlobal(snap.dealers)).filter(subFilter);
    const o = {};
    for(const l of locs){
      const p = stripSuffix(l.p);
      (o[p] ??= new Map()).set(l.n + '||' + (l.a||''), l);
    }
    return o;
  };
  const curSets = buildProvLocs(CUR);
  const preSets = PREV ? buildProvLocs(PREV) : {};

  const allProvs = new Set([...Object.keys(curSets), ...Object.keys(preSets)]);
  const total = [...allProvs].reduce((s,p)=>s+(curSets[p]?.size||0), 0);

  // 表格行数据
  const rows = [...allProvs].map(p => {
    const cur = curSets[p] ? curSets[p].size : 0;
    const pre = preSets[p] ? preSets[p].size : 0;
    let add=0, rem=0;
    if(curSets[p]) for(const n of curSets[p].keys()) if(!preSets[p] || !preSets[p].has(n)) add++;
    if(preSets[p]) for(const n of preSets[p].keys()) if(!curSets[p] || !curSets[p].has(n)) rem++;
    return {p, cur, pre, add, rem, pct: total ? cur/total*100 : 0};
  }).sort((a,b)=> b.cur - a.cur);

  // 缓存每省网点明细(供点击弹窗): 新增→退出→在营, 组内按名称
  PROV_LOCS = {};
  const _statusOrd = {新增:0, 退出:1, 在营:2};
  for(const p of allProvs){
    const cm = curSets[p] || new Map(), pm = preSets[p] || new Map();
    const list = [];
    for(const [k,l] of cm) list.push({status: pm.has(k)?'在营':'新增', ...l});
    for(const [k,l] of pm) if(!cm.has(k)) list.push({status:'退出', ...l});
    list.sort((a,b)=> (_statusOrd[a.status]-_statusOrd[b.status]) || (a.n||'').localeCompare(b.n||''));
    PROV_LOCS[p] = list;
  }

  // 渲染表格
  const tbody = document.querySelector('#provTable tbody');
  tbody.innerHTML = rows.map(r => {
    const addCell = r.add ? `<span style="color:#1a7f37">+${r.add}</span>` : '<span style="color:#8c959f">0</span>';
    const remCell = r.rem ? `<span style="color:#cf222e">-${r.rem}</span>` : '<span style="color:#8c959f">0</span>';
    return `<tr data-prov="${r.p}" style="cursor:pointer" title="点击查看${r.p}网点明细">
      <td>${r.p}</td>
      <td style="text-align:right">${r.cur}</td>
      <td style="text-align:right;color:#656d76">${r.pct.toFixed(1)}%</td>
      <td style="text-align:right">${addCell}</td>
      <td style="text-align:right">${remCell}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="5" class="empty">无数据</td></tr>`;
  tbody.onclick = e=>{ const tr=e.target.closest('tr[data-prov]'); if(tr) openProvDetailModal(tr.dataset.prov); };

  const provTitleBrand = (()=>{
    const g = ACTIVE_BRAND;
    if(GROUP_SUBS[g] && SUB_CHECKED && SUB_CHECKED.size>0)
      return [...SUB_CHECKED].join(' ');
    return g;
  })();
  document.getElementById('provMapTitle').textContent = `${provTitleBrand} · 省份分布`;

  // 渲染地图: 当期数染色 + tooltip 对比期/新增/退出
  const dataMap = {};
  for(const p of allProvs){
    const v = curSets[p] ? curSets[p].size : 0;
    if(!v) continue;
    for(const full of fullProvNames(p)) dataMap[full] = v;
  }
  // 反向索引: 全称 → 简称, 用于 tooltip
  const shortOf = {};
  for(const p of allProvs) for(const full of fullProvNames(p)) shortOf[full] = p;
  const rowMap = Object.fromEntries(rows.map(r=>[r.p, r]));

  const max = Math.max(1, ...rows.map(r=>r.cur));
  provMapChart.setOption({
    backgroundColor:'transparent',
    tooltip:{trigger:'item', formatter:p=>{
      const sn = shortOf[p.name];
      const r = sn ? rowMap[sn] : null;
      if(!r) return `${p.name}<br/>无数据`;
      const sign = (r.cur-r.pre)>0?'+':'';
      const dColor = (r.cur-r.pre)>0?'#1a7f37':(r.cur-r.pre)<0?'#cf222e':'#8c959f';
      return `<div style="font-weight:600;margin-bottom:3px">${p.name}</div>`
        + `<div>当期: <b>${r.cur}</b> <span style="color:${dColor}">（${sign}${r.cur-r.pre}）</span></div>`
        + (PREV?`<div>对比期: ${r.pre}</div>`:'')
        + `<div style="color:#1a7f37">新增 +${r.add}</div>`
        + `<div style="color:#cf222e">退出 -${r.rem}</div>`;
    }},
    visualMap:{min:0, max, left:20, bottom:30, calculable:true,
      inRange:{color:['#fef3ec','#f7b38b','#e8532a','#9b1f10']},
      textStyle:{fontSize:13}},
    series:[{
      type:'map', map:'china', roam:false,
      center:[104.5, 36], zoom:1.2,
      data: Object.entries(dataMap).map(([name,value])=>({name, value})),
      label:{show:true, fontSize:10, color:'#24292f', fontWeight:600, position:'inside',
        textShadowColor:'rgba(255,255,255,0.9)', textShadowBlur:4,
        formatter:p=>{const sn=shortOf[p.name];const r=sn?rowMap[sn]:null;return r?String(r.cur):''}},
      emphasis:{label:{show:true, fontSize:13, fontWeight:600}},
      itemStyle:{borderColor:'#fff', borderWidth:.5}
    }],
  }, true);
  provMapChart.resize();
  // 点省份 → 弹该省网点明细(off 先解绑, 避免 renderProvMap 多次调用重复绑定)
  provMapChart.off('click');
  provMapChart.on('click', pe=>{ const sn = shortOf[pe.name]; if(sn && PROV_LOCS[sn] && PROV_LOCS[sn].length) openProvDetailModal(sn); });

  const jieSubBlock = document.getElementById('jieSubBlock');
  const jieBlock = document.getElementById('jieStoreBlock');
  if(ACTIVE_BRAND==='鸿蒙智行' && !SUB_CHECKED){
    // 五界子品牌对比
    jieSubBlock.style.display='flex';
    const SUBS = ['问界','智界','享界','尊界','尚界'];
    const subDealers = filterGlobal(CUR.dealers).filter(d=>d.g==='鸿蒙智行');
    const subLocs = buildLocations(subDealers);
    const subCur = {};
    for(const s of SUBS) subCur[s]=0;
    for(const l of subLocs) for(const s of l.subs) if(s in subCur) subCur[s]++;
    const subPrev = {};
    if(PREV){
      const prevDealers = filterGlobal(PREV.dealers).filter(d=>d.g==='鸿蒙智行');
      const prevLocs2 = buildLocations(prevDealers);
      for(const s of SUBS) subPrev[s]=0;
      for(const l of prevLocs2) for(const s of l.subs) if(s in subPrev) subPrev[s]++;
    }
    const subVals = SUBS.map(s=>subCur[s]);
    jieSubChart.setOption({
      backgroundColor:'transparent',
      grid:{left:50,right:16,top:28,bottom:30},
      tooltip:{trigger:'axis',formatter:p=>{
        const s=p[0].axisValue, cur=p[0].value;
        const prev=PREV?subPrev[s]:null;
        let diff='';
        if(prev!==null){const d=cur-prev;const sign=d>0?'+':'';const col=d>0?'#1a7f37':d<0?'#cf222e':'#8c959f';diff=` <span style="color:${col}">(${sign}${d})</span>`;}
        return `${s}<br/><b>${cur}</b>${diff}`;
      }},
      xAxis:{type:'category',data:SUBS,axisLabel:{fontSize:12}},
      yAxis:{type:'value',minInterval:1,splitNumber:3,axisTick:{show:false},axisLabel:{fontSize:11,formatter:v=>Number.isInteger(v)?v:''},splitLine:{lineStyle:{color:'#e1e4e8'}}},
      series:[{type:'bar',data:subVals,barMaxWidth:28,
        itemStyle:{color:'#174ea6',borderRadius:[3,3,0,0]},
        label:{show:true,position:'top',fontSize:12,color:'#24292f'}}]
    },true);
    jieSubChart.resize();
    jieBlock.style.display='flex';
    const allLocs = buildLocations(filterGlobal(CUR.dealers).filter(d=>d.g==='鸿蒙智行'));
    const jieCnt = {};
    for(const l of allLocs){
      const n = l.subs.size;
      jieCnt[n] = (jieCnt[n]||0)+1;
    }
    const maxN = Math.max(...Object.keys(jieCnt).map(Number), 1);
    const labels=[], vals=[];
    for(let i=1;i<=maxN;i++){ labels.push(`${i}界店`); vals.push(jieCnt[i]||0); }
    jieStoreChart.setOption({
      backgroundColor:'transparent',
      grid:{left:50,right:16,top:28,bottom:30},
      tooltip:{trigger:'axis',formatter:p=>`${p[0].axisValue}<br/><b>${p[0].value}</b> 家`},
      xAxis:{type:'category',data:labels,axisLabel:{fontSize:12}},
      yAxis:{type:'value',minInterval:1,splitNumber:3,axisTick:{show:false},axisLabel:{fontSize:11,formatter:v=>Number.isInteger(v)?v:''},splitLine:{lineStyle:{color:'#e1e4e8'}}},
      series:[{type:'bar',data:vals,barMaxWidth:28,
        itemStyle:{color:'#174ea6',borderRadius:[3,3,0,0]},
        label:{show:true,position:'top',fontSize:12,color:'#24292f'}}]
    },true);
    jieStoreChart.resize();
  } else {
    jieSubBlock.style.display='none';
    jieBlock.style.display='none';
  }
  // 奔驰特色授权网点（G级车 / AMG / 迈巴赫 / 合计）
  const mbBlock = document.getElementById('mbTagBlock');
  if(ACTIVE_BRAND==='奔驰'){
    mbBlock.style.display='flex';
    renderMbTag();
  } else {
    mbBlock.style.display='none';
  }
}

// ── 点省份 → 弹窗看该省网点明细(在营/新增/退出), 字段同可视化明细表 ──
function openProvDetailModal(prov){
  const data = PROV_LOCS[prov];
  if(!data || !data.length) return;
  const brandLbl = (()=>{
    const g = ACTIVE_BRAND;
    if(GROUP_SUBS[g] && SUB_CHECKED && SUB_CHECKED.size>0) return `${g}（${[...SUB_CHECKED].join(' ')}）`;
    return g;
  })();
  const nCur = data.filter(r=>r.status!=='退出').length;
  const nAdd = data.filter(r=>r.status==='新增').length;
  const nRem = data.filter(r=>r.status==='退出').length;
  const period = PREV ? `${fmtTs(PREV.ts)} → ${fmtTs(CUR.ts)}` : fmtTs(CUR.ts);
  let mask = document.getElementById('provModal');
  if(!mask){ mask = document.createElement('div'); mask.id='provModal'; mask.className='modal-mask'; document.body.appendChild(mask); }
  mask.innerHTML = `<div class="modal-card">
    <div class="modal-head">
      <div><b>${prov}</b> · ${brandLbl}　<span style="color:var(--mute);font-weight:400;font-size:13px">当期 ${nCur} · <span style="color:#1a7f37">新增 +${nAdd}</span> · <span style="color:#cf222e">退出 -${nRem}</span>　${period}</span></div>
      <div style="display:flex;align-items:center;gap:12px">
        <button class="den-mapbtn" id="provMapBtn">🗺 在地图上查看</button>
        <button class="modal-x" aria-label="关闭">×</button>
      </div>
    </div>
    <input class="modal-search" placeholder="搜索名称 / 地址 / 城市 …">
    <div class="modal-body"><table class="modal-table">
      <thead><tr><th>状态</th><th>名称</th><th>大区</th><th>省/市</th><th>等级</th><th>类型</th><th>地址</th></tr></thead>
      <tbody></tbody></table></div>
  </div>`;
  mask.style.display = 'flex';
  const render = (q='')=>{
    const ql = q.trim().toLowerCase();
    const list = ql ? data.filter(r=>(r.n||'').toLowerCase().includes(ql)||(r.a||'').toLowerCase().includes(ql)||(r.c||'').toLowerCase().includes(ql)) : data;
    const tb = mask.querySelector('.modal-table tbody');
    if(!list.length){ tb.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--mute);padding:24px">无匹配</td></tr>'; return; }
    tb.innerHTML = list.map(r=>{
      const cls = r.status==='新增'?'add':r.status==='退出'?'del':'';
      return `<tr>
        <td><span class="pill ${cls}">${r.status}</span></td>
        <td>${r.n||''}</td><td>${r.r||''}</td><td>${r.p||''} ${r.c||''}</td>
        <td>${r.lv||''}</td><td>${r.t||''}</td>
        <td style="color:var(--mute)">${r.a||''}</td>
      </tr>`;
    }).join('');
  };
  render();
  const close = ()=>{ mask.style.display='none'; document.removeEventListener('keydown', onEsc); };
  function onEsc(ev){ if(ev.key==='Escape') close(); }
  mask.querySelector('.modal-x').onclick = close;
  mask.onclick = e=>{ if(e.target===mask) close(); };
  mask.querySelector('.modal-search').oninput = e=>render(e.target.value);
  mask.querySelector('#provMapBtn').onclick = ()=>{
    close();
    openStoreMap(`${prov} · ${brandLbl}（当期在营）`, data.filter(r=>r.status!=='退出'));
  };
  document.addEventListener('keydown', onEsc);
}

/* ============ 奔驰特色授权网点图 ============ */
// 一家店可同时带多个授权，"合计"按去重并集计数；百分比分母 = 奔驰卖车门店（性质含"销售"）
function renderMbTag(){
  const isSales = d => (d.t||'').includes('销售');
  const hasG    = d => (d.mk||'').includes('G级车');
  const hasAMG  = d => (d.mk||'').includes('AMG');   // 同时匹配 AMG 与 AMG纯电
  const hasMay  = d => (d.mk||'').includes('迈巴赫');
  const hasAny  = d => hasG(d) || hasAMG(d) || hasMay(d);
  const count = ds => [ds.filter(hasG).length, ds.filter(hasAMG).length, ds.filter(hasMay).length, ds.filter(hasAny).length];

  const cur = filterGlobal(CUR.dealers).filter(d=>d.g==='奔驰');
  const [cg, ca, cm, cu] = count(cur);
  const denom = cur.filter(isSales).length;
  const pct = denom ? (cu/denom*100) : 0;

  let prevVals = null, prevDenom = null;
  if(PREV){
    const pv = filterGlobal(PREV.dealers).filter(d=>d.g==='奔驰');
    prevVals = count(pv);
    prevDenom = pv.filter(isSales).length;
  }

  const LABELS = ['G-Class','AMG','迈巴赫','合计'];
  const vals = [cg, ca, cm, cu];
  const data = vals.map((v,i)=>({value:v, itemStyle:{color: i===3 ? '#0b2e6b' : '#174ea6', borderRadius:[3,3,0,0]}}));

  mbTagChart.setOption({
    backgroundColor:'transparent',
    grid:{left:36,right:16,top:24,bottom:26},
    tooltip:{trigger:'axis',formatter:p=>{
      const i=p[0].dataIndex, cu2=p[0].value;
      let diff='';
      if(prevVals){const d=cu2-prevVals[i];const sign=d>0?'+':'';const col=d>0?'#1a7f37':d<0?'#cf222e':'#8c959f';diff=` <span style="color:${col}">(${sign}${d})</span>`;}
      const extra = i===3 ? `<br/>占卖车门店 ${pct.toFixed(1)}%` : '';
      return `${LABELS[i]}<br/><b>${cu2}</b> 家${diff}${extra}`;
    }},
    xAxis:{type:'category',data:LABELS,axisLabel:{fontSize:12}},
    yAxis:{type:'value',minInterval:1,splitNumber:3,axisTick:{show:false},axisLabel:{fontSize:11,formatter:v=>Number.isInteger(v)?v:''},splitLine:{lineStyle:{color:'#e1e4e8'}}},
    series:[{type:'bar',data,barMaxWidth:30,
      label:{show:true,position:'top',fontSize:12,color:'#24292f'}}]
  },true);
  mbTagChart.resize();

  // 合计 = 具备 G-Class / AMG / 迈巴赫 任一高端授权的去重门店；分母 = 奔驰卖车门店（性质含销售）
  document.getElementById('mbTagNote').innerHTML =
    `具备高端授权（G-Class / AMG / 迈巴赫 之一）的门店共 <b>${cu}</b> 家，占奔驰卖车门店（${denom} 家）的 <b>${pct.toFixed(1)}%</b>。`;
}

/* ============ 净变化 tab：品牌网点数 / 净变化（胶囊标签 + 细条形列表） ============ */
function renderNet(curLocs, prevLocs){
  // 按品牌(g)聚合；当 ACTIVE_BRAND 选了含子品牌的集团，按子品牌(b)聚合
  const dim = (ACTIVE_BRAND && GROUP_SUBS[ACTIVE_BRAND]) ? 'b' : 'g';
  const aggCur = aggBy(curLocs, dim);
  const aggPre = PREV ? aggBy(prevLocs, dim) : null;
  let names = Object.keys(aggCur);
  if(aggPre) for(const k in aggPre) if(!(k in aggCur)) names.push(k);
  let data;
  if(PREV){
    // 变化量：物理计数（与 KPI 总计对齐）
    data = names.map(n=>{
      const cur = aggCur[n] || 0;
      const pre = aggPre[n] || 0;
      const cList = curLocs.filter(l => dim==='b' ? l.subs.has(n) : l.g===n);
      const pList = prevLocs.filter(l => dim==='b' ? l.subs.has(n) : l.g===n);
      const diff = pairPeriodChanges(cList, pList);
      return {n, cur, pre, d:cur-pre, add:diff.added.length, rem:diff.removed.length};
    });
  } else {
    data = names.map(n=>({n, cur:aggCur[n]||0, pre:null, d:null, add:0, rem:0}));
  }
  data.sort((a,b)=>b.cur-a.cur);  // 降序，从上到下阅读
  const max = Math.max(1, ...data.map(x=>x.cur));
  const el = document.getElementById('netchart');
  el.innerHTML = data.map(x=>{
    const color = trendGroupColorOf(x.n);
    const pct = (x.cur/max*100).toFixed(1);
    const deltaHtml = x.d===null ? '' :
      `（<span class="${x.d>0?'d-pos':x.d<0?'d-neg':'d-zero'}">${x.d>0?'+':''}${x.d}</span>）`;
    const title = PREV ? `${x.n}
新增 +${x.add} / 减少 -${x.rem}` : x.n;
    return `<div class="bar-row" data-brand="${x.n}" title="${title}">
      <div class="bar-pill" style="background:${color}1f;color:${color}">${x.n}</div>
      <div class="bar-line">
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
        <div class="bar-val"><div class="bar-val-num"><b>${x.cur}</b>${deltaHtml}</div></div>
      </div>
    </div>`;
  }).join('');
  // 数字列表头（"网点数（净变化）"）要跟下面每行数字列的右边缘对齐，但列表本身可能出现纵向
  // 滚动条（是否出现、占多宽跟浏览器/是否溢出有关），表头在滚动条外面天然会跟数字错位——
  // 这里直接拿第一行数字的真实右边缘量出偏差，把表头的右内边距补上，做到像素级对齐，
  // 不去猜滚动条宽度这类容易跟浏览器不一致的数字。
  const header = document.getElementById('netColHeader');
  const firstVal = el.querySelector('.bar-val');
  if(header && firstVal){
    header.style.paddingRight = '0px';
    const diff = header.getBoundingClientRect().right - firstVal.getBoundingClientRect().right;
    header.style.paddingRight = Math.max(0, diff) + 'px';
  }
}

// 按 dim(g/b) 分组，返回 {dimValue: Set<locKey>}，用于增/减/不变集合运算
function keySetsBy(locs, dim){
  const o={};
  for(const l of locs){
    const hl = l.g==='鸿蒙智行' ? himaLoc(l.n) : null;  // 鸿蒙取地点段（P042 同店双名），其余原始名+地址防误合并
    const k = hl ? `${hl}||${l.p}||` : `${l.n}||${l.p}||${l.a||''}`;
    if(dim==='b'){
      for(const s of l.subs){ (o[s] ??= new Set()).add(k); }
    } else {
      (o[l.g] ??= new Set()).add(k);
    }
  }
  return o;
}

function aggBy(locs, dim){
  const o={};
  for(const l of locs){
    if(dim==='b'){
      // 按子品牌：一个 location 可能有多个子品牌，每个 +1
      for(const s of l.subs) o[s]=(o[s]||0)+1;
    } else {
      o[l.g]=(o[l.g]||0)+1;
    }
  }
  return o;
}

/* ============ 明细 tab ============ */
let DETAIL_ROWS = [];
function renderDetail(curLocs, added, removed, changed, conf){
  if(!curLocs){
    curLocs = filterAll(CUR.dealers);
    const prevLocs = PREV ? filterAll(PREV.dealers) : [];
    const diff = pairPeriodChanges(curLocs, prevLocs);
    added = diff.added; removed = diff.removed; changed = diff.changed;
    // P043：相邻期对比时 PREV2 已在 render() 里加载好，这里同步重算确认口径
    conf = PREV2 ? confirmPeriodDiff(diff, curLocs, prevLocs, filterAll(PREV2.dealers)) : null;
  }
  const ak = new Set(added.map(lkLoc)), rk = new Set(removed.map(lkLoc));
  const ck = new Map((changed||[]).map(l => [lkLoc(l), l]));
  // P043：回归 = added 里 ∈T-2 的项（conf.added 带 ret 标）
  const retK = conf ? new Set(conf.added.filter(x=>x.ret).map(lkLoc)) : null;
  const rows = [];
  for(const l of curLocs){
    const ch = ck.get(lkLoc(l));
    const isAdd = ak.has(lkLoc(l));
    const status = isAdd ? (retK && retK.has(lkLoc(l)) ? '回归' : '新增') : ch ? '变更' : '存量';
    rows.push({status, oldAddress:ch?.oldAddress||'', oldName:ch?.oldName||'', ...l});
  }
  for(const l of removed){
    rows.push({status: conf ? '疑似退出' : '退出', ...l});
  }
  // P043：确认退出 = T-2 有、T-1/T 均无且无同店存活的行（来自 T-2 数据）
  if(conf) for(const l of conf.removedConfirmed){
    rows.push({status:'确认退出', ...l});
  }
  // PREV 模式下默认按 状态(新增/退出 优先) → 品牌 排
  rows.sort((a,b)=>{
    const order={'新增':0,'回归':1,'退出':2,'确认退出':2,'疑似退出':3,'变更':4,'存量':5};
    return (order[a.status]-order[b.status]) || a.g.localeCompare(b.g);
  });
  DETAIL_ROWS = rows;
  applySearch();
}

function applySearch(){
  const q = (document.getElementById('search').value||'').trim().toLowerCase();
  const filtered = q ? DETAIL_ROWS.filter(r =>
    (r.n||'').toLowerCase().includes(q) ||
    (r.a||'').toLowerCase().includes(q) ||
    (r.c||'').toLowerCase().includes(q) ||
    (r.p||'').toLowerCase().includes(q)
  ) : DETAIL_ROWS;
  document.getElementById('rowCount').textContent = `${filtered.length} 条`;
  const tb = document.querySelector('#detailT tbody');
  if(!filtered.length){ tb.innerHTML = `<tr><td colspan="8" class="empty">无数据</td></tr>`; return; }
  tb.innerHTML = filtered.slice(0,1000).map(r=>{
    const cls = r.status==='新增'?'add' : (r.status==='退出'||r.status==='确认退出')?'del' : r.status==='回归'?'ret' : r.status==='疑似退出'?'obs' : '';
    const subs = (GROUP_SUBS[r.g] && r.subs && r.subs.size>1) ? `<span style="color:var(--mute);font-size:13px"> (${[...r.subs].join('+')})</span>`:'';
    const oldBits = [];
    if(r.oldName && r.oldName !== r.n) oldBits.push(`原名称：${r.oldName}`);
    if(r.oldAddress && r.oldAddress !== r.a) oldBits.push(`原地址：${r.oldAddress}`);
    const addr = oldBits.length ? `${r.a||''}<div style="font-size:12px;color:#8c959f;margin-top:2px">${oldBits.join('<br>')}</div>` : (r.a||'');
    return `<tr>
      <td><span class="pill ${cls}">${r.status}</span></td>
      <td>${r.g}${subs}</td>
      <td>${r.n||''}</td>
      <td>${r.r||''}</td>
      <td>${r.p||''} ${r.c||''}</td>
      <td>${r.lv||''}</td>
      <td>${r.t||''}</td>
      <td style="color:var(--mute)">${addr}</td>
    </tr>`;
  }).join('') + (filtered.length>1000?`<tr><td colspan="8" class="empty">仅显示前 1000 条，请用搜索/筛选缩小范围或导出 CSV</td></tr>`:'');
}

document.addEventListener('input', e=>{ if(e.target.id==='search') applySearch(); });

function exportCSV(){
  const q = (document.getElementById('search').value||'').trim().toLowerCase();
  const rows = q ? DETAIL_ROWS.filter(r=>
    (r.n||'').toLowerCase().includes(q) ||
    (r.a||'').toLowerCase().includes(q) ||
    (r.c||'').toLowerCase().includes(q) ||
    (r.p||'').toLowerCase().includes(q)
  ) : DETAIL_ROWS;
  const head = ['状态','品牌','子品牌','名称','大区','省','市','等级','类型','地址','电话'];
  const esc = v => `"${(v==null?'':String(v)).replace(/"/g,'""')}"`;
  const lines = [head.join(',')];
  for(const r of rows){
    lines.push([r.status, r.g, [...(r.subs||[])].join('+'), r.n, r.r, r.p, r.c, r.lv, r.t, r.a, r.ph].map(esc).join(','));
  }
  const blob = new Blob(['﻿'+lines.join('\n')], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=`dealers_${CUR.ts}${PREV?`_vs_${PREV.ts}`:''}.csv`;
  a.click(); URL.revokeObjectURL(url);
}

/* ========= 自助取数页 (一期 MVP) ========= */
// 独立期数选择 (EXT_TS)，与顶栏「当前日期」互不影响；筛选状态跨换期保留，
// 级联失效项 (选中的市不在新省域/新期内) 在重渲染时自动清理。
let EXT_TS = null, EXT_SEQ = 0;
const EXT_SEL = { g:new Set(), cat:new Set(), r:new Set(), p:new Set(), c:new Set(), d:new Set(), lv:new Set(), cap:new Set() };
const EXT_CATS = [['ev','新势力'],['luxury','豪华'],['super','超豪华']];
const EXT_CAT_LABEL = Object.fromEntries(EXT_CATS);
// 八组筛选的 dd 顺序/标签（经销商性质与网点查询页对齐后移除）；cond 药丸分类配色
const EXT_FIELDS = [['g','品牌'],['cat','品类'],['r','大区'],['p','省份'],['c','城市'],['d','区'],['lv','城市等级'],['cap','网点能力']];
const EXT_COND_LABEL = {g:'品牌',cat:'品类',r:'大区',p:'省份',c:'城市',d:'区',lv:'等级',cap:'能力'};
const EXT_COND_CLS = {p:'c-geo',c:'c-geo',d:'c-geo',r:'c-geo',g:'c-brand',cat:'c-brand',cap:'c-cap',lv:'c-other'};
function extDistVal(d){ return d.d ? d.d : '未定位'; }
// 全部筛选器 AND，同一筛选器内多选 OR；对原始 dealers 行过滤 (能力/性质在行级才准确)，之后再 buildLocations 去重
function extFilterRows(dealers){
  return dealers.filter(d=>{
    if(EXT_SEL.g.size   && !EXT_SEL.g.has(d.g)) return false;
    if(EXT_SEL.cat.size && !EXT_SEL.cat.has(penCatOf(d.g))) return false;
    if(EXT_SEL.r.size   && !EXT_SEL.r.has(d.r||'')) return false;
    if(EXT_SEL.p.size   && !EXT_SEL.p.has(stripSuffix(d.p))) return false;
    if(EXT_SEL.c.size   && !EXT_SEL.c.has(d.c||'')) return false;
    if(EXT_SEL.d.size   && !EXT_SEL.d.has(extDistVal(d))) return false;
    if(EXT_SEL.lv.size  && !EXT_SEL.lv.has(d.lv||'')) return false;
    if(EXT_SEL.cap.size && ![...EXT_SEL.cap].some(c=>hasCap(d,c))) return false;
    return true;
  });
}
async function renderExtract(){
  const host = document.getElementById('extractBody');
  if(!DATA || !DATA.snapshots || !DATA.snapshots.length){ host.innerHTML='<div class="doc-sub">数据加载中…</div>'; return; }
  if(!EXT_TS || !DATA.snapshots.some(s=>s.ts===EXT_TS)) EXT_TS = DATA.snapshots.at(-1).ts;
  const seq = ++EXT_SEQ;
  // 重渲染前记住展开中的 dd 及其滚动位置，渲染后还原（chip 多选时弹层不收起）
  const _openDD = host.querySelector('.dd.open');
  // 期数日历选完即收起，不参与展开态恢复（否则选完日期弹层又被复原成打开）
  const openKey = (_openDD && _openDD.dataset.extdd !== 'period') ? _openDD.dataset.extdd : null;
  const openScroll = _openDD ? ((_openDD.querySelector('.dd-pop-inner')||{}).scrollTop||0) : 0;
  if(!SNAP_CACHE[EXT_TS]) host.innerHTML = '<div class="doc-sub">明细加载中…</div>';
  let snap;
  try{ snap = await ensureSnap(EXT_TS); }
  catch(e){ host.innerHTML = `<div class="doc-sub">明细加载失败：${e && e.message || e}</div>`; return; }
  if(seq !== EXT_SEQ) return;   // 期数已被再次切换，丢弃过期渲染
  const dealers = snap.dealers;

  // 选项集: 品牌/大区/省/级别取全期分布；市、区按已选省(市)级联收窄
  const cG={}, cR={}, cP={}, cLv={}, cC={}, cD={};
  for(const d of dealers){
    cG[d.g]=(cG[d.g]||0)+1;
    if(d.r) cR[d.r]=(cR[d.r]||0)+1;
    const pv=stripSuffix(d.p); if(pv) cP[pv]=(cP[pv]||0)+1;
    if(d.lv) cLv[d.lv]=(cLv[d.lv]||0)+1;
    if(EXT_SEL.p.size && !EXT_SEL.p.has(pv)) continue;
    if(d.c) cC[d.c]=(cC[d.c]||0)+1;
    if(EXT_SEL.c.size && !EXT_SEL.c.has(d.c||'')) continue;
    const dv=extDistVal(d); cD[dv]=(cD[dv]||0)+1;
  }
  // 级联收窄后清掉已失效的下游选择 (含换期后消失的值)
  for(const v of [...EXT_SEL.c]) if(!(v in cC)) EXT_SEL.c.delete(v);
  for(const v of [...EXT_SEL.d]) if(!(v in cD)) EXT_SEL.d.delete(v);
  for(const v of [...EXT_SEL.g]) if(!(v in cG)) EXT_SEL.g.delete(v);

  const rows = extFilterRows(dealers);
  const locs = buildLocations(rows);   // 物理网点去重，口径与全站一致

  // 弹层选项照抄网点查询 .opt/.check 结构：首行「全部」清空该组，其余多选
  const opt = (f,v,label,extra='')=>`<div class="opt${EXT_SEL[f].has(v)?' sel':''}" data-extf="${f}" data-extv="${v}"><span class="check"></span>${extra}<span class="nm">${label||v}</span></div>`;
  const allOpt = f=>`<div class="opt${EXT_SEL[f].size?'':' sel'}" data-extall="${f}"><span class="check"></span><span class="nm">全部</span></div>`;
  const zh = (a,b)=>a.localeCompare(b,'zh');
  const CHIPS = {
    g:   Object.keys(cG).sort((a,b)=>cG[b]-cG[a]).map(g=>opt('g',g,g,`<span class="dot" style="background:${trendGroupColorOf(g)}"></span>`)).join(''),
    cat: EXT_CATS.map(([k,l])=>opt('cat',k,l)).join(''),
    r:   Object.keys(cR).sort((a,b)=>cR[b]-cR[a]).map(r=>opt('r',r)).join(''),
    p:   Object.keys(cP).sort(zh).map(p=>opt('p',p)).join(''),
    c:   Object.keys(cC).sort(zh).map(c=>opt('c',c)).join(''),
    d:   Object.keys(cD).sort((a,b)=>{ if(a==='未定位') return 1; if(b==='未定位') return -1; return zh(a,b); }).map(v=>opt('d',v)).join(''),
    lv:  TIERS.filter(t=>cLv[t]).concat(Object.keys(cLv).filter(t=>!TIERS.includes(t))).map(t=>opt('lv',t)).join(''),
    cap: ['销售','售后'].map(c=>opt('cap',c)).join(''),
  };
  // dd 值摘要: 空=全部 / 1 项=项名 / 多项=N 项
  const ddSummary = f => {
    const s = EXT_SEL[f];
    if(!s.size) return '全部';
    if(s.size===1){ const v=[...s][0]; return f==='cat' ? EXT_CAT_LABEL[v] : v; }
    return `${s.size} 项`;
  };
  const ddHtml = (f,label)=>`
    <div class="dd ext-dd${EXT_SEL[f].size?' has':''}" data-extdd="${f}">
      <span class="dd-lbl">${label}</span><span class="dd-val">${ddSummary(f)}</span><span class="dd-arrow">▾</span>
      <div class="dd-pop wide"><div class="dd-pop-inner">${allOpt(f)}${CHIPS[f]||'<div class="opt" style="color:var(--mute)">（本期无选项）</div>'}</div></div>
    </div>`;

  // 已选条件药丸行: 地理蓝 / 品牌绿 / 能力性质黄 / 其他灰，每个可单删
  let condPills = '';
  for(const [f] of EXT_FIELDS){
    for(const v of EXT_SEL[f]){
      const disp = f==='cat' ? EXT_CAT_LABEL[v] : v;
      const dot = f==='g' ? `<span class="dot" style="background:${trendGroupColorOf(v)}"></span>` : '';
      condPills += `<span class="ext-cond ${EXT_COND_CLS[f]}">${dot}${EXT_COND_LABEL[f]} = ${disp}<span class="x" data-extf="${f}" data-extv="${v}">✕</span></span>`;
    }
  }
  const condRow = condPills ? `<div class="ext-condrow"><span class="cl">已选条件</span>${condPills}<span class="clr" id="extClear">清空全部</span></div>` : '';

  const previewRows = locs.slice(0,10).map(l=>{
    const subs = (GROUP_SUBS[l.g] && l.subs && l.subs.size) ? `<span style="color:var(--mute);font-size:12px"> (${[...l.subs].join('+')})</span>` : '';
    return `<tr><td>${l.g}${subs}</td><td>${l.n||''}</td><td>${l.p||''}</td><td>${l.c||''}</td><td>${l.d||'未定位'}</td><td>${l.lv||''}</td><td>${l.t||''}</td><td style="color:var(--mute)">${l.a||''}</td><td>${l.ph||''}</td></tr>`;
  }).join('');
  // 期数用与「数据下载/当期报告」同款日历弹窗（隐藏 select + setupCalendarDropdown）
  const periodOptions = DATA.snapshots.map(s=>`<option value="${s.ts}"${s.ts===EXT_TS?' selected':''}>${fmtTs(s.ts)}</option>`).join('');
  // 覆盖城市与网点查询页同口径：县级市归并母市（getPrefCity）
  const nCity  = new Set(locs.map(l=>getPrefCity(l)).filter(Boolean)).size;
  const nBrand = new Set(locs.map(l=>l.g)).size;
  const kpi = (lb,v,unit)=>`<div class="kpi"><div class="label">${lb}</div><div class="value">${v}<small>${unit}</small></div></div>`;

  host.innerHTML = `
    <div class="pen-head"><div class="pen-title">自助取数</div></div>
    <div class="doc-sub">物理网点去重口径与全站一致 · 筛选器之间为「且」、同一筛选器内多选为「或」 · 导出 CSV 可直接用 Excel 打开</div>

    <div class="ext-zone">
      <div class="ext-zt"><span class="ext-no">1</span>选择期数</div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <div class="dd" data-extdd="period">
          <span class="dd-lbl">当前期数</span><span class="dd-val" id="extTsVal">${fmtTs(EXT_TS)}</span><span class="dd-arrow">▾</span>
          <div class="dd-pop" id="extTsPop"></div>
          <select id="extTsSel" style="display:none">${periodOptions}</select>
        </div>
        <span style="font-size:12px;color:var(--mute)">（默认最新一期，可选任意历史期）</span>
      </div>
    </div>

    <div class="ext-zone">
      <div class="ext-zt"><span class="ext-no">2</span>设定筛选条件 <span class="ext-hint">下拉多选，选中的药丸会亮起</span></div>
      <div class="filter-row">${EXT_FIELDS.map(([f,label])=>ddHtml(f,label)).join('')}</div>
      ${condRow}
    </div>

    <div class="ext-zone">
      <div class="ext-zt"><span class="ext-no">3</span>预览与导出</div>
      <div class="ext-kpis">
        ${kpi('筛选结果（物理网点）', locs.length, '家')}
        ${kpi('原始数据行', rows.length, '行')}
        ${kpi('覆盖城市', nCity, '个')}
        ${kpi('覆盖品牌', nBrand, '个')}
      </div>
      <div class="ext-panel">
        <div class="ext-toolbar">
          <span class="cnt">预览前 <b>${Math.min(locs.length,10)}</b> 行（共 ${locs.length} 家，导出不受限）</span>
          <button class="ext-btn" id="extExport">⬇ 导出 CSV（${locs.length} 家）</button>
        </div>
        <div style="overflow-x:auto"><table class="hyb-table ext-table">
          <thead><tr><th>品牌</th><th>名称</th><th>省</th><th>市</th><th>区</th><th>城市级别</th><th>类型</th><th>地址</th><th>电话</th></tr></thead>
          <tbody>${previewRows || `<tr><td colspan="9" style="color:var(--mute);padding:24px">无匹配结果，请调整筛选条件</td></tr>`}</tbody>
        </table></div>
      </div>
      <div class="ext-ft">口径：物理网点去重（鸿蒙智行同店双名合并、按品牌组统计）；「未定位」= 地址暂未解析出行政区的网点；省 / 市 / 区选项级联收窄（选了省，市选项只显示该省的）；CSV 为 UTF-8（带 BOM），Excel 双击打开中文不乱码。</div>
    </div>`;

  // dd 开合复用全站机制 (bindDDToggle + document 级 closeAllDD)；还原重渲染前展开的弹层
  host.querySelectorAll('.dd').forEach(bindDDToggle);
  if(openKey){
    const dd = host.querySelector(`[data-extdd="${openKey}"]`);
    if(dd){ dd.classList.add('open'); const inner = dd.querySelector('.dd-pop-inner'); if(inner) inner.scrollTop = openScroll; }
  }
  // 期数日历（与数据下载/当期报告同款组件）
  const tsSel = document.getElementById('extTsSel');
  setupCalendarDropdown('extTsSel', 'extTsPop', 'extTsVal', {allowNone:false});
  tsSel.addEventListener('change', ()=>{ if(tsSel.value && tsSel.value !== EXT_TS){ EXT_TS = tsSel.value; renderExtract(); } });
  const toggle = (f,v)=>{ const s = EXT_SEL[f]; s.has(v) ? s.delete(v) : s.add(v); renderExtract(); };
  host.querySelectorAll('.opt[data-extf]').forEach(el=>{ el.onclick = ()=>toggle(el.dataset.extf, el.dataset.extv); });
  host.querySelectorAll('.opt[data-extall]').forEach(el=>{ el.onclick = ()=>{ EXT_SEL[el.dataset.extall].clear(); renderExtract(); }; });
  host.querySelectorAll('.ext-cond .x').forEach(el=>{ el.onclick = ()=>toggle(el.dataset.extf, el.dataset.extv); });
  const clr = document.getElementById('extClear');
  if(clr) clr.onclick = ()=>{ Object.values(EXT_SEL).forEach(s=>s.clear()); renderExtract(); };
  document.getElementById('extExport').onclick = ()=> extExportCSV(locs);
}
function extExportCSV(locs){
  const head = ['品牌','子品牌','名称','大区','省','市','区','城市级别','类型','地址','电话'];
  const esc = v => `"${(v==null?'':String(v)).replace(/"/g,'""')}"`;
  const lines = [head.join(',')];
  for(const l of locs){
    lines.push([l.g, [...(l.subs||[])].join('+'), l.n, l.r, l.p, l.c, l.d||'未定位', l.lv, l.t, l.a, l.ph].map(esc).join(','));
  }
  const blob = new Blob(['﻿'+lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `自助取数_${EXT_TS}_共${locs.length}家.csv`;
  a.click(); URL.revokeObjectURL(url);
}

/* ========= 城市覆盖率页：品牌 × 线级 城市覆盖率 ========= */
const PEN_TIERS = ['一线','二线','三线','四线','五线'];
let PEN_TYPE = 'all';
const PEN_CAT_ORDER = [['ev','新能源'],['luxury','豪华'],['super','超豪华']];
function penCatOf(name){
  const hit = DOC_BRANDS.find(x=>x.b===name);
  if(hit) return hit.cat;
  const g = TREND_CHILD_TO_GROUP[name];            // 子品牌 → 品牌组
  if(g){ const gh = DOC_BRANDS.find(x=>x.b===g); if(gh) return gh.cat; }
  return 'luxury';
}
// 把网点城市归并到 342 表内城市（县级市→母市），不在表内则返回 ''
function penInTableCity(c){
  const CT = DATA.cityTier || {}, CP = DATA.countyParent || {};
  if(CT[c] !== undefined) return c;
  const p = CP[c];
  if(p && CT[p] !== undefined) return p;
  return '';
}
// 统计每个品牌/子品牌/品牌组在各线级覆盖的去重城市集合（线级取自权威表，分子⊆分母）
function penCoverage(dealers){
  const CT = DATA.cityTier || {};
  const map = {};
  const ensure = k => map[k] || (map[k] = {tiers:{}, cities:new Set()});
  for(const d of dealers){
    if(PEN_TYPE === 'sales' && !hasCap(d, '销售')) continue;
    if(PEN_TYPE === 'after' && !hasCap(d, '售后')) continue;
    const city = penInTableCity(d.c);
    if(!city) continue;                              // 不在 342 表内（含未分级/省直管县）不计
    const tier = CT[city];
    if(!PEN_TIERS.includes(tier)) continue;
    const add = k => { const m=ensure(k); (m.tiers[tier] || (m.tiers[tier]=new Set())).add(city); m.cities.add(city); };
    const b = d.b || d.g;
    add(b);                                          // 子品牌（或单品牌）行
    if(GROUP_SUBS[d.g] && d.g!==b) add(d.g);         // 含子品牌的品牌组并集行
  }
  return map;
}
const EMPTY_COV = {tiers:{}, cities:new Set()};
function renderPenetration(){
  const host = document.getElementById('penBody');
  if(!CUR){ host.innerHTML='<div class="pen-sub">数据加载中…</div>'; return; }
  const totals = DATA.tierTotals || {};
  const grand = PEN_TIERS.reduce((s,t)=>s+(totals[t]||0),0);
  const cov = penCoverage(CUR.dealers);

  // 方案5 混合表格：每格 = 覆盖率量条 + 精确数字；行首 = 色块 + 品牌 + 大数字摘要
  const CATN = {ev:'新势力', luxury:'豪华', super:'超豪华'};
  const bcell = (pct, strong)=>`<td><div class="hyb-bc${strong?' strong':''}"><div class="tr"><i style="width:${pct}%;background:${strong?'#0b2e6b':'#174ea6'}"></i></div><span class="v">${pct}%</span></div></td>`;
  const rowHtml = (name, entry, cat, child)=>{
    const c = entry.cities.size, pct = grand ? Math.round(c/grand*100) : 0;
    const tierCells = PEN_TIERS.map(t=>{
      const tot = totals[t]||0, n = entry.tiers[t] ? entry.tiers[t].size : 0;
      return bcell(tot ? Math.round(n/tot*100) : 0, false);
    }).join('');
    const head = child
      ? `<td class="hyb-rh hyb-child">${name}</td>`
      : `<td class="hyb-rh"><span class="hyb-sq" style="background:${trendGroupColorOf(name)}"></span><span class="nm">${name}</span><span class="hyb-cat cat-${cat}">${CATN[cat]||cat}</span><div class="hero">${c}<small>城 · ${pct}%</small></div></td>`;
    return `<tr${child?' class="hyb-childrow"':''}>${head}${tierCells}${bcell(pct, true)}</tr>`;
  };

  // 行序：合计覆盖降序（品类以行内标签标注）；品牌组行后跟其子品牌行
  const subNames = new Set(Object.values(GROUP_SUBS).flat());
  const units = Object.keys(cov).filter(k=>!subNames.has(k)).sort((a,b)=>cov[b].cities.size-cov[a].cities.size);
  let body = '';
  for(const u of units){
    body += rowHtml(u, cov[u], penCatOf(u), false);
    if(GROUP_SUBS[u]){
      for(const s of GROUP_SUBS[u].filter(x=>cov[x]).sort((a,b)=>cov[b].cities.size-cov[a].cities.size))
        body += rowHtml(s, cov[s], penCatOf(u), true);
    }
  }

  const th = (t)=>`<th>${t}<span class="den">/${totals[t]||0}城</span></th>`;
  const segBtn = (key,label)=>`<button data-pentype="${key}" class="${PEN_TYPE===key?'on':''}">${label}</button>`;
  host.innerHTML = `
    <div class="pen-head">
      <div class="pen-title">城市覆盖率</div>
      <div class="pen-seg">${segBtn('all','全部')}${segBtn('sales','销售')}${segBtn('after','售后')}</div>
    </div>
    <div class="doc-sub">数据周期：${fmtTs(CUR.ts)}</div>
    <div class="doc-note">
      <b>切换周期：</b>本页随顶部「当前日期」切换，仅显示该期、不含对比期。换期请到 <span style="display:inline-flex;align-items:center;gap:5px;padding:1px 7px;border:1px solid rgba(0,0,0,.18);border-radius:5px;font-weight:600;white-space:nowrap">网点查询 顶栏 <span style="color:#1a7f37">→</span> 当前日期 ▾</span> 选好期数后返回本页。<br>
      <b>网点能力：</b>右上角可切换「全部 / 销售 / 售后」。同一物理网点可同时具备销售和售后能力；钣喷并入售后；全部按城市并集去重，不把双能力重复相加。<br>
      <b>口径：</b>城市覆盖率 = 品牌覆盖的城市数 ÷ 该线级城市总数，去重到城市（一城多店只计一个）。城市分级取自 342 城市分级表（一线 8 / 二线 38 / 三线 39 / 四线 121 / 五线 136）。<br>
      <b>怎么读：</b>每格 = 量条 + 精确覆盖率，同列上下扫即是跨品牌对比；行首大数字 = 覆盖城市数，品牌色块与全站图表配色一致。合计列 = 覆盖城市数 ÷ 342（按城市数加权，非各线级平均）。鸿蒙智行 / 奥迪的子品牌以缩进行列于品牌组行下方。
    </div>
    <table class="hyb-table">
      <thead><tr>
        <th style="width:190px;text-align:left;padding-left:14px">品牌</th>${PEN_TIERS.map(th).join('')}
        <th style="width:170px">合计<span class="den">/${grand}城</span></th>
      </tr></thead>
      <tbody>${body}</tbody>
    </table>`;
  host.querySelectorAll('.pen-seg button').forEach(btn=>{
    btn.onclick = ()=>{ const t=btn.dataset.pentype; if(t!==PEN_TYPE){ PEN_TYPE=t; renderPenetration(); } };
  });
}

    <div style="overflow-x:auto"><table class="hyb-table">
      <thead><tr><th style="width:150px;text-align:left;padding-left:14px">区</th>${th}<th>其他<span class="den">${rest.length}品牌</span></th><th style="width:160px">合计</th></tr></thead>
      <tbody>${body}</tbody>
    </table></div>`;

  host.querySelectorAll('[data-dencity]').forEach(b=>{ b.onclick=()=>{ DEN_CITY=b.dataset.dencity; renderDensity(); }; });
  host.querySelectorAll('[data-dentype]').forEach(b=>{ b.onclick=()=>{ DEN_TYPE=b.dataset.dentype; renderDensity(); }; });
  host.querySelectorAll('td.den-dist').forEach(td=>{
    const dist = td.dataset.dist;
    if(dist==='未定位') return;
    td.onclick = ()=> openStoreMap(`${DEN_CITY} ${dist}`, locs.filter(l=>(l.d||'')===dist));
  });
  document.getElementById('denCityMap').onclick = ()=> openStoreMap(`${DEN_CITY} · 全部品牌`, locs);
}

/* ── 高德地图弹窗：门店打点（懒加载 JS API，只用底图+标注，不调服务接口） ── */
let AMAP_LOADER = null, AMAP_MAP = null;
function loadAMap(){
  if(window.AMap && window.AMap.Map) return Promise.resolve();
  if(AMAP_LOADER) return AMAP_LOADER;
  AMAP_LOADER = new Promise((res, rej)=>{
    window.__amapcb = res;
    const s = document.createElement('script');
    s.src = `https://webapi.amap.com/maps?v=2.0&key=${AMAP_JS_KEY}&callback=__amapcb`;
    s.onerror = ()=>{ AMAP_LOADER=null; rej(new Error('高德地图脚本加载失败')); };
    document.head.appendChild(s);
  });
  return AMAP_LOADER;
}

async function openStoreMap(title, stores){
  const withGeo = stores.filter(s=>s.lng && s.lat);
  const missing = stores.length - withGeo.length;
  let mask = document.getElementById('mapModal');
  if(!mask){ mask = document.createElement('div'); mask.id='mapModal'; mask.className='modal-mask'; document.body.appendChild(mask); }
  const missTip = missing>0 ? `　<span style="color:var(--warn)">另有 ${missing} 家未定位未显示</span>` : '';
  mask.innerHTML = `<div class="modal-card">
    <div class="modal-head">
      <div><b>${title}</b>　<span style="color:var(--mute);font-weight:400;font-size:13px">已定位 ${withGeo.length} 家${missTip}</span></div>
      <button class="modal-x" aria-label="关闭">×</button>
    </div>
    <div id="amapBox"></div>
    <div class="map-legend" id="mapLegend"></div>
  </div>`;
  mask.style.display = 'flex';
  const close = ()=>{
    mask.style.display='none'; document.removeEventListener('keydown', onEsc);
    if(AMAP_MAP){ AMAP_MAP.destroy(); AMAP_MAP=null; }
  };
  function onEsc(ev){ if(ev.key==='Escape') close(); }
  mask.querySelector('.modal-x').onclick = close;
  mask.onclick = e=>{ if(e.target===mask) close(); };
  document.addEventListener('keydown', onEsc);

  const box = document.getElementById('amapBox');
  if(!withGeo.length){ box.innerHTML = '<div class="err" style="padding:40px;text-align:center">这批门店均无坐标（地址未编码成功）</div>'; return; }
  try{ await loadAMap(); }
  catch(e){ box.innerHTML = `<div class="err" style="padding:40px;text-align:center">${e.message}（检查网络或 key 域名白名单）</div>`; return; }

  // 品牌 → 颜色（按数量降序分配，保证图例主次分明）
  const cnt = {};
  for(const s of withGeo) cnt[s.g] = (cnt[s.g]||0)+1;
  const ordered = Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);
  const colorOf = {};
  ordered.forEach((g,i)=>{ colorOf[g] = MAP_PALETTE[i % MAP_PALETTE.length]; });
  document.getElementById('mapLegend').innerHTML = ordered.map(g=>
    `<span class="lg"><span class="dot" style="background:${colorOf[g]}"></span>${g} <b>${cnt[g]}</b></span>`).join('');

  if(AMAP_MAP){ AMAP_MAP.destroy(); AMAP_MAP=null; }
  AMAP_MAP = new AMap.Map('amapBox', {viewMode:'2D', resizeEnable:true, mapStyle:'amap://styles/whitesmoke'});
  const info = new AMap.InfoWindow({isCustom:true, content:'', offset:new AMap.Pixel(0,-14)});
  for(const s of withGeo){
    const mk = new AMap.CircleMarker({
      center:[s.lng, s.lat], radius:7, fillColor:colorOf[s.g], fillOpacity:.9,
      strokeColor:'#fff', strokeWeight:1.5, cursor:'pointer', bubble:false,
    });
    mk.on('click', ()=>{
      info.setContent(`<div class="amap-info-win"><div class="t">${s.n||''}</div>
        <div class="m">${s.g||''}${s.t?' · '+s.t:''}</div>
        <div class="m">${s.a||''}</div>${s.ph?`<div class="m">☎ ${s.ph}</div>`:''}</div>`);
      info.open(AMAP_MAP, [s.lng, s.lat]);
    });
    mk.setMap(AMAP_MAP);
  }
  AMAP_MAP.on('click', ()=>info.close());
  const lngs = withGeo.map(s=>s.lng), lats = withGeo.map(s=>s.lat);
  if(withGeo.length===1){ AMAP_MAP.setZoomAndCenter(14, [lngs[0], lats[0]]); }
  else AMAP_MAP.setBounds(new AMap.Bounds([Math.min(...lngs), Math.min(...lats)], [Math.max(...lngs), Math.max(...lats)]), false, [40,40,40,40]);
}

const DOC_GROUPS = [
  {key:'ev', label:'新能源'},
  {key:'luxury', label:'豪华'},
  {key:'super', label:'超豪华'},
];

function renderDoc(){
  const body = document.getElementById('docBody');
  if(body.dataset.rendered) return;

  const rows = DOC_GROUPS.map(g => {
    const items = DOC_BRANDS.filter(x => x.cat === g.key).map(x => `<tr class="cat-${g.key}">
      <td class="brand-col">${x.b}</td>
      <td class="sales-col">${x.sales || '<span class="muted">-</span>'}</td>
      <td class="service-col">${x.service || '<span class="muted">-</span>'}</td>
      <td class="note-col">${x.note || ''}</td>
    </tr>`).join('');
    return `<tr class="group-row cat-${g.key}"><td colspan="4"><span class="group-label">${g.label}</span></td></tr>${items}`;
  }).join('');

  const html = `
    <h1 class="doc-title">统计口径说明</h1>
    <div class="doc-sub">更新日期：2026-06 · 共 22 个品牌（含鸿蒙智行 5 个子品牌）· 口径表按品牌/品牌组展示</div>
    <div class="doc-note">
      <b>说明：</b>本页按“销售能力 / 售后能力”说明各品牌网点纳入范围。同一实体网点如同时承担销售和售后服务，在销售、售后视图中均可出现；在全部口径下仅按物理网点计一次。钣金喷漆等服务统一并入售后能力，不再单独列示。
    </div>
    <div class="doc-rules">
      <div class="doc-rule">
        <h3>网点如何分类</h3>
        <ul>
          <li>销售能力：凡是能买车的网点，包括 4S 店、展厅、体验中心、用户中心、交付中心等。</li>
          <li>售后能力：承担保养、维修、服务中心、服务站、钣金喷漆等服务的网点。</li>
          <li>同一网点可以同时具备销售与售后能力；能力视图用于筛选，不改变原始门店记录。</li>
        </ul>
      </div>
      <div class="doc-rule">
        <h3>如何避免重复计数</h3>
        <ul>
          <li>名称和地址完全相同的重复条目直接合并。</li>
          <li>同一地址挂了多种服务类型时，合并为一个物理网点，并保留销售/售后能力信息。</li>
          <li>同一城市内名称相同的网点合并；不同城市的同名网点不合并。</li>
          <li>全部视图按物理网点去重，不能把销售数量和售后数量直接相加。</li>
        </ul>
      </div>
      <div class="doc-rule">
        <h3>跨期对比框架</h3>
        <ul>
          <li>第一层用“品牌组 + 原始店名 + 省份 + 地址”识别同一物理网点。</li>
          <li>第二层处理地址更新：继续比较区县、路名门牌和地址相似度；单一同名同城候选也视为地址变更。</li>
          <li>第三层处理名称更新：同品牌组下，地址或规范化店名主干高度相似时，视为同店改名/类型调整。</li>
          <li>以上都无法配对的记录，才进入新增或退出。</li>
        </ul>
      </div>
      <div class="doc-rule">
        <h3>增减口径：二期确认制</h3>
        <ul>
          <li>动机：单期抓取波动（官网临时下架、接口漏爬）会造成同一家店"一退一增"的虚报。二期确认制用相邻三期（T-2 / T-1 / T）交叉验证，把这类抖动吸收掉；代价是真实退网信号晚一周确认。</li>
          <li>新增（确认）：本期出现、且上两期均不存在的门店，计入"新增"。</li>
          <li>回归：本期出现、上期缺席、但上上期存在（严格仅隔一期）的门店，视为抓取波动回归，不计新增，明细中标"回归"。缺口≥2 期后重新出现的门店仍按新增计（其退网已在更早报告确认计数过）。</li>
          <li>疑似退出（观察中）：上期在、本期首次缺席的门店，不计入"退出"头数，明细中标"观察中"，待下期确认。</li>
          <li>确认退出：连续两期缺席（上上期在、上期与本期均无），且排除同店改名后仍在营的情况，计入"退出"。</li>
          <li>适用范围：仅"相邻期"对比（当期报告、网点查询选相邻上一期时）；月度报告与自定义区间对比不适用。网点总数一律按当期实抓，不受此规则影响。</li>
        </ul>
      </div>
      <div class="doc-rule">
        <h3>统计范围</h3>
        港澳台网点不纳入统计，仅统计中国大陆门店。城市覆盖率按品牌覆盖的城市去重计算，一城多店只计一个城市；命中的同店地址或名称变化会使用本期新地址展示，不计入新增/退出。
      </div>
    </div>
    <div class="doc-table-wrap">
      <table class="doc-table">
        <thead>
          <tr>
            <th>品牌</th>
            <th>销售</th>
            <th>售后</th>
            <th>备注说明</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;

  body.innerHTML = html;
  body.dataset.rendered = '1';
}

/* ========= 更新日志页面（按月份分组） ========= */
function renderChangelog(){
  const body = document.getElementById('changelogBody');
  if(body.dataset.rendered) return;

  // 按月份(YYYY-MM)分组, 保持 CHANGELOG 原顺序(最新在前)
  const groups = [], gi = {};
  for(const e of CHANGELOG){
    const m = e.date.slice(0,7);
    if(!(m in gi)){ gi[m] = groups.length; groups.push({month:m, list:[]}); }
    groups[gi[m]].list.push(e);
  }
  const monthLabel = m => { const [y,mo] = m.split('-'); return `${y} 年 ${+mo} 月`; };

  const sections = groups.map(g => {
    const items = g.list.map(e => {
      const inner = e.items ? `<ul>${e.items.map(i=>`<li>${i}</li>`).join('')}</ul>` : e.text;
      const dm = e.date.slice(5).replace('-','/'); // MM/DD, 月份已在分组标题
      return `<div class="doc-log-item">
        <div class="doc-log-date">${dm}</div>
        <div class="doc-log-body"><span class="doc-log-tag ${e.tag}">${e.tagText}</span>${inner}</div>
      </div>`;
    }).join('');
    return `<div class="cl-month"><div class="cl-month-hd">${monthLabel(g.month)}</div><div class="doc-log">${items}</div></div>`;
  }).join('');

  body.innerHTML = `<h1 class="doc-title">更新日志</h1>
    <div class="doc-sub">看板重要更新记录 · 按月份归档 · 最新在最前</div>
    ${sections}`;
  body.dataset.rendered = '1';
}
