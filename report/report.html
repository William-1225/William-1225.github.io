<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>竞对经销商网点查询</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
  :root { --bg:#f7fafc; --panel:#ffffff; --line:#e2e8f0; --fg:#1a202c; --mute:#718096;
          --acc:#2563eb; --acc-soft:#eaf2ff; --pos:#059669; --neg:#dc2626; --warn:#d97706;
          --card:#ffffff; --side-bg:#111827; --side-line:#243244; --side-hover:#1f2937;
          --side-fg:#f8fafc; --side-mute:#a7b0bf; --side-active:#1e40af; --side-active-fg:#ffffff; }
  *{box-sizing:border-box}
  /* 注: 不要给 body/任何 chart 祖先加 CSS `zoom`/`transform:scale()`,
     会让 ECharts 鼠标事件坐标与内部 canvas 坐标系比例错位, tooltip/axisPointer 越往底部偏移越大. */
  body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.55 -apple-system,Segoe UI,Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;height:100vh;overflow:hidden}
  /* ── 应用容器 ── */
  .app{display:flex;height:100vh;width:100vw;overflow:hidden}
  .page{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
  /* ── 左侧导航 ── */
  .sidebar{width:200px;min-width:200px;background:var(--side-bg);border-right:1px solid var(--side-line);display:flex;flex-direction:column;padding:0;gap:0;flex-shrink:0;box-shadow:1px 0 0 rgba(15,23,42,.02)}
  .sidebar-logo{padding:24px 20px 20px;font-size:20px;font-weight:700;color:var(--side-fg);letter-spacing:0;line-height:1.2;border-bottom:1px solid var(--side-line)}
  .sidebar-logo .sub{font-size:13px;font-weight:400;color:var(--side-mute);margin-top:5px;letter-spacing:0;text-transform:uppercase}
  .sidebar-divider{display:none}
  .nav-group{display:flex;flex-direction:column;padding:12px 12px;gap:12px}
  .sidebar-foot{margin-top:auto;padding:14px 20px 16px;font-size:12px;color:var(--side-mute);border-top:1px solid var(--side-line);cursor:pointer;transition:color .12s}
  .sidebar-foot:hover{color:var(--side-fg)}
  .sidebar-foot .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#10b981;margin-right:6px;vertical-align:1px}
  .nav-item{position:relative;display:flex;align-items:center;gap:10px;padding:11px 12px 11px 14px;cursor:pointer;color:var(--side-mute);font-size:16px;border-radius:8px;transition:all .12s;font-weight:400;letter-spacing:0}
  .nav-item:hover{background:var(--side-hover);color:var(--side-fg)}
  .nav-item.active{background:var(--side-active);color:var(--side-active-fg);font-weight:600}
  .nav-item.active::before{content:"";position:absolute;left:6px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--side-active-fg)}
  .nav-item .ico{width:16px;height:16px;color:currentColor;opacity:.9;flex-shrink:0}
  .side-action-group{padding:0 12px 12px}
  .side-action{width:100%;position:relative;display:flex;align-items:center;gap:10px;padding:11px 12px 11px 14px;background:transparent;border:0;border-radius:8px;color:var(--side-mute);font:inherit;font-size:16px;font-weight:400;text-align:left;cursor:pointer;transition:all .12s}
  .side-action:hover{background:var(--side-hover);color:var(--side-fg)}
  .side-action .ico{width:16px;height:16px;color:currentColor;opacity:.9;flex-shrink:0}
  /* ── 数据下载页 ── */
  .page-title{font-size:16px;font-weight:600;color:var(--fg);margin-bottom:24px}
  .dl-card{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 18px;background:var(--card);border:1px solid var(--line);border-radius:8px}
  .dl-card-name{font-size:13px;font-weight:600;color:var(--fg)}
  .dl-card-meta{font-size:11px;color:var(--mute);margin-top:2px}
  .dl-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .dl-select{min-width:170px}
  .dl-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font-size:12px;text-decoration:none;cursor:pointer;white-space:nowrap}
  .dl-btn:hover{border-color:var(--acc);color:var(--acc)}

  /* 顶栏 (codex 风格：无下边线，大内边距) */
  header{padding:22px 28px 14px;border-bottom:0;background:var(--bg);position:sticky;top:0;z-index:10}
  .titlebar{display:flex;align-items:center;gap:14px;margin-bottom:16px}
  .titlebar h1{margin:0;font-size:24px;font-weight:700;letter-spacing:0;color:var(--fg)}
  .titlebar .meta{color:var(--mute);font-size:12px;margin-left:auto}
  .filter-row{display:flex;align-items:center;gap:8px;padding:0;flex-wrap:wrap}
  select,button{background:var(--card);color:var(--fg);border:1px solid var(--line);padding:7px 12px;border-radius:6px;font:inherit;cursor:pointer;font-size:13px}
  select:hover,button:hover{border-color:var(--acc)}
  button.primary{background:var(--acc);color:#fff;border-color:var(--acc)}

  /* 矩形下拉按钮 (筛选维度，codex 风格) */
  .dd{position:relative;display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);
      border-radius:6px;padding:6px 11px;cursor:pointer;font-size:13px;user-select:none;
      box-shadow:none;transition:border-color .12s}
  .dd:hover{border-color:var(--acc)}
  .dd.open{border-color:var(--acc);box-shadow:0 0 0 3px rgba(59,130,246,.08)}
  .dd .dd-lbl{color:var(--mute);font-size:11px;letter-spacing:.2px}
  .dd .dd-val{color:var(--fg);font-weight:500}
  .dd .dd-arrow{color:var(--mute);font-size:10px;margin-left:2px;transition:transform .15s;transform:rotate(-90deg)}
  .dd.open .dd-arrow{transform:rotate(0deg);color:var(--acc)}
  .dd .dd-pop{display:none;position:absolute;top:calc(100% + 6px);left:0;min-width:200px;max-width:320px;
              background:var(--card);border:1px solid var(--line);border-radius:8px;
              box-shadow:0 10px 28px rgba(15,23,42,.1);padding:0;z-index:50;cursor:default;overflow:visible}
  .dd .dd-pop .dd-pop-inner{padding:6px;max-height:60vh;overflow-y:auto;overflow-x:visible}
  .dd .dd-pop.wide{min-width:280px;max-width:380px}
  .dd.open .dd-pop{display:block}
  .dd .dd-pop .opt{padding:7px 10px;border-radius:6px;cursor:pointer;font-size:13px;
                   display:flex;align-items:center;gap:9px;line-height:1.3;position:relative}
  .dd .dd-pop .opt:hover{background:#fbfbfb}
  .dd .dd-pop .opt.sel{color:var(--acc);font-weight:600}
  /* CSS 画 checkbox 方框 + 对勾 */
  .dd .dd-pop .opt .check{
    width:14px;height:14px;border:1.5px solid #cbd5e1;border-radius:3px;background:#fff;
    flex-shrink:0;position:relative;display:inline-block;transition:all .12s;
  }
  .dd .dd-pop .opt:hover > .check{border-color:var(--acc)}
  .dd .dd-pop .opt.sel > .check{background:var(--acc);border-color:var(--acc)}
  .dd .dd-pop .opt.sel > .check::after{
    content:'';position:absolute;left:3.5px;top:0px;width:5px;height:9px;
    border:solid #fff;border-width:0 1.5px 1.5px 0;transform:rotate(45deg);
  }
  .dd .dd-pop .opt .nm{flex:1}
  .dd .dd-pop .opt .cnt{color:var(--mute);font-size:12px;font-weight:400;margin-left:auto;padding-left:8px}
  .dd .dd-pop .opt.quick{font-weight:500}
  .dd .dd-pop .opt.quick + .opt:not(.quick){margin-top:5px;border-top:1px solid var(--line);padding-top:12px}
  .dd .dd-pop .opt.dim{opacity:.4;cursor:not-allowed}
  .dd .dd-pop .opt.dim:hover{background:transparent}
  /* 子品牌右侧三级菜单 */
  .dd .dd-pop .opt .sub-toggle{
    margin-left:6px;color:var(--mute);font-size:14px;cursor:pointer;
    padding:3px 8px;border-radius:4px;transition:all .12s;flex-shrink:0;line-height:1;
  }
  .dd .dd-pop .opt .sub-toggle:hover{background:rgba(0,0,0,.08);color:var(--acc)}
  .dd .dd-pop .opt.expanded .sub-toggle{color:var(--acc);background:var(--acc-soft);transform:rotate(90deg)}
  .dd .dd-pop .opt .sub-pop{
    display:none;position:fixed;
    min-width:180px;background:var(--card);border:1px solid var(--line);
    border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.1);
    padding:6px;z-index:200;max-height:60vh;overflow-y:auto;
    font-weight:400;color:var(--fg);
  }
  .dd .dd-pop .opt.expanded .sub-pop{display:block}

  /* ====== 日历选择器 (当前日期 / 对比日期) ====== */
  .dd .dd-pop .cal{padding:8px;min-width:232px}
  .cal-hd{display:flex;align-items:center;gap:2px;margin-bottom:6px}
  .cal-title{flex:1;text-align:center;font-weight:600;font-size:13px;color:var(--fg)}
  .cal-nav{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;
           border-radius:5px;color:var(--mute);cursor:pointer;font-size:13px;user-select:none;transition:all .12s}
  .cal-nav:hover{background:var(--acc-soft);color:var(--acc)}
  .cal-nav.dis{opacity:.3;cursor:default;pointer-events:none}
  .cal-wk{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:2px}
  .cal-wk span{text-align:center;font-size:11px;color:var(--mute);padding:3px 0}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:30px;
            align-content:start;gap:2px}
  .cal-d{height:30px;display:flex;align-items:center;justify-content:center;font-size:12px;
         border-radius:5px;color:var(--mute)}
  .cal-d.empty{visibility:hidden}
  .cal-d.off{color:#cbd5e1;cursor:default}
  .cal-d.on{color:var(--acc);font-weight:600;cursor:pointer}
  .cal-d.on:hover{background:var(--acc-soft)}
  .cal-d.sel,.cal-d.sel:hover{background:var(--acc);color:#fff}
  .cal-none{margin-top:6px;padding:6px;text-align:center;font-size:12px;border-radius:5px;
            border:1px solid var(--line);color:var(--mute);cursor:pointer;transition:all .12s}
  .cal-none:hover{border-color:var(--acc);color:var(--acc)}
  .cal-none.sel{background:var(--acc);color:#fff;border-color:var(--acc)}

  .chip{background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:14px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:all .12s;user-select:none}
  .chip:hover{border-color:var(--acc)}
  .chip.active{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}
  .chip.disabled{opacity:.35;cursor:not-allowed}
  .chip .n{font-weight:600}
  .chip .d{font-size:12px}
  .chip .d.pos{color:var(--pos)} .chip .d.neg{color:var(--neg)} .chip .d.zero{color:var(--mute)}

  /* KPI — 页面底色容器 + 白色卡片 */
  .kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:10px 28px 14px;background:var(--bg)}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 16px;min-height:0}
  .kpi .label{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px;font-weight:500;margin-bottom:6px}
  .kpi .value{font-size:24px;font-weight:600;line-height:1.2;letter-spacing:-.02em}
  .kpi .delta{font-size:12px;margin-top:3px}
  .kpi .delta.pos{color:var(--pos)} .kpi .delta.neg{color:var(--neg)} .kpi .delta.zero{color:var(--mute)}

  /* 城市覆盖率页 */
  .pen-title{font-size:20px;font-weight:700;margin:0 0 4px;color:var(--fg)}
  .pen-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:0 0 4px;flex-wrap:wrap}
  .pen-seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#fff;flex-shrink:0}
  .pen-seg button{appearance:none;border:none;background:transparent;padding:6px 16px;font-size:13px;font-weight:600;color:#475467;cursor:pointer;border-left:1px solid var(--line)}
  .pen-seg button:first-child{border-left:none}
  .pen-seg button.on{background:#1a7f37;color:#fff}
  .pen-legend{display:inline-flex;align-items:center;gap:7px;margin-left:2px;color:#475467}
  .pen-legend .bar{height:10px;width:120px;border-radius:3px;background:linear-gradient(90deg,rgba(26,127,55,.12),rgba(26,127,55,.7))}
  .pen-table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
  .pen-table th,.pen-table td{border-bottom:1px solid var(--line);padding:0}
  .pen-table thead th{position:sticky;top:0;background:#f8fafc;z-index:2;text-align:center;font-weight:600;color:#475467;padding:8px 6px;border-bottom:2px solid var(--line);white-space:nowrap}
  .pen-table thead th .den{display:block;font-size:11px;font-weight:400;color:var(--mute);margin-top:1px}
  .pen-table th:first-child{text-align:left;padding-left:23px}
  .pen-cat-row td{font-weight:650;color:var(--fg);background:#fbfcfe;padding:8px 8px 8px 12px}
  .pen-cat-row .pen-cat-label{display:inline-flex;align-items:center;gap:7px}
  .pen-cat-row .pen-cat-label::before{content:"";display:inline-block;width:4px;height:18px;border-radius:4px;background:var(--group)}
  .pen-table td.pen-brand{position:relative;text-align:left;padding:9px 14px 9px 40px;white-space:nowrap;font-weight:600;color:var(--fg)}
  .pen-brand::before{content:"";position:absolute;left:26px;top:50%;width:4px;height:18px;border-radius:4px;background:var(--group);transform:translateY(-50%)}
  tr.pen-childrow .pen-brand{padding-left:54px;font-weight:400;color:#475467}
  tr.pen-childrow .pen-brand::before{display:none}
  .pen-table tbody tr:hover{background:#fbfcfe}
  .pen-cell{text-align:center;padding:7px 4px;line-height:1.25}
  .pen-cell .pen-pct{display:block;font-weight:600;font-size:13px}
  .pen-cell .pen-frac{display:block;font-size:10.5px;opacity:.7}
  .pen-total .pen-frac{opacity:.85}

  /* 混合表格（方案5：表格骨架 × 卡片填充，覆盖率页与密度页共用） */
  .hyb-table{border-collapse:collapse;width:100%;font-size:13px}
  .hyb-table thead th{position:sticky;top:0;background:#f8fafc;z-index:2;font-size:12px;color:#475467;font-weight:600;padding:6px 10px;text-align:center;border-bottom:2px solid var(--line);white-space:nowrap}
  .hyb-table thead th .den{font-weight:400;color:var(--mute);margin-left:3px}
  .hyb-table td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle;text-align:center}
  .hyb-table tbody tr:hover td{background:#fbfcfe}
  .hyb-rh{white-space:nowrap;text-align:left !important}
  .hyb-rh .nm{font-weight:700;font-size:13.5px}
  .hyb-rh .hero{font-size:19px;font-weight:700;line-height:1.2}
  .hyb-rh .hero small{font-size:11px;color:var(--mute);font-weight:400;margin-left:3px}
  .hyb-sq{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px}
  .hyb-dot{display:inline-block;width:8px;height:8px;border-radius:2.5px;margin-right:5px;vertical-align:0}
  .hyb-cat{font-size:10px;font-weight:600;padding:1px 6px;border-radius:8px;margin-left:6px;vertical-align:1px}
  .hyb-cat.cat-ev{background:#eaf2ff;color:#1c5cab}
  .hyb-cat.cat-luxury{background:#fdf3dd;color:#8a5c00}
  .hyb-cat.cat-super{background:#fdeaea;color:#a92c2c}
  tr.hyb-childrow td{background:#fcfdfe}
  .hyb-child{padding-left:34px !important;font-weight:400;color:#475467;font-size:12.5px}
  .hyb-bc{display:flex;align-items:center;gap:8px;min-width:88px}
  .hyb-bc .tr{flex:1;height:9px;background:rgba(11,11,11,.045);border-radius:4.5px;overflow:hidden}
  .hyb-bc .tr i{display:block;height:100%;border-radius:4.5px}
  .hyb-bc .v{font-size:12px;color:#475467;min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
  .hyb-bc.strong .tr{height:11px}
  .hyb-bc.strong .v{font-weight:700;color:var(--fg)}
  .hyb-nc{position:relative;display:inline-block;min-width:36px;height:22px;line-height:22px;text-align:center;font-size:12.5px;font-weight:600;border-radius:4px;overflow:hidden;vertical-align:middle}
  .hyb-nc i{position:absolute;top:0;left:0;bottom:0;background:#bfd8f7;opacity:.45;border-radius:4px}
  .hyb-nc span{position:relative}
  .hyb-nc.zero{color:#c9c8c1;font-weight:400}
  .hyb-table td.den-dist{cursor:pointer}
  .hyb-table td.den-dist .nm{color:var(--acc)}
  .hyb-table td.den-dist:hover .nm{text-decoration:underline}
  .hyb-table tr.den-nogeo td.den-dist{cursor:default}
  .hyb-table tr.den-nogeo td.den-dist .nm{color:var(--mute);font-weight:500;text-decoration:none}

  /* 网点密度页（区级品牌布局矩阵） */
  .den-table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
  .den-table thead th{position:sticky;top:0;background:#f8fafc;z-index:2;text-align:center;font-weight:600;color:#475467;padding:8px 6px;border-bottom:2px solid var(--line);white-space:nowrap}
  .den-table thead th:first-child{text-align:left;padding-left:14px}
  .den-table td{border-bottom:1px solid var(--line);text-align:center;padding:7px 5px}
  .den-table td.den-dist{text-align:left;padding-left:14px;white-space:nowrap;font-weight:600;color:var(--acc);cursor:pointer}
  .den-table td.den-dist:hover{text-decoration:underline}
  .den-table tr.den-nogeo td.den-dist{color:var(--mute);cursor:default;font-weight:400}
  .den-table tr.den-nogeo td.den-dist:hover{text-decoration:none}
  .den-table tbody tr:hover{background:#fbfcfe}
  .den-table td.den-total{font-weight:700}
  .den-catgap{border-left:2px solid var(--line)}
  .den-mapbtn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--acc);cursor:pointer}
  .den-mapbtn:hover{background:var(--acc-soft)}
  /* 高德地图弹窗 */
  #mapModal .modal-card{width:min(1200px,94vw);max-height:92vh}
  #amapBox{height:min(66vh,640px);width:100%;background:#f1f5f9}
  .map-legend{display:flex;flex-wrap:wrap;gap:6px 12px;padding:10px 20px;border-top:1px solid var(--line);font-size:12.5px;color:var(--fg)}
  .map-legend .lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .map-legend .dot{width:10px;height:10px;border-radius:3px;display:inline-block;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
  .amap-info-win{font:13px/1.6 -apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;padding:10px 12px;background:#fff;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.18);max-width:300px}
  .amap-info-win .t{font-weight:700;margin-bottom:3px}
  .amap-info-win .m{color:#656d76;font-size:12.5px}

  /* 月度报告 */
  #page-monthly .kpi-row, #page-report .kpi-row{padding:10px 0 16px;background:transparent}
  /* 注：报告注入 CSS 含 #monthlyBody *{padding:0} reset(特异性1,0,0)，故下列必须带 #page-monthly 前缀才能压过 */
  #page-monthly .monthly-summary{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:0 8px 8px 0;padding:16px 20px;margin-bottom:22px}
  #page-monthly .monthly-summary .ms-para{font-size:14px;line-height:1.9;margin:0 0 10px;color:var(--fg)}
  #page-monthly .monthly-summary .ms-bullets{margin:0;padding-left:22px;font-size:13px;line-height:2;color:var(--fg);list-style-position:outside}
  /* 月度大表 */
  .monthly-table{width:100%;border-collapse:collapse;margin-bottom:8px;font-size:13px}
  .monthly-table th{text-align:right;font-weight:600;color:var(--mute);font-size:12px;padding:8px 12px;border-bottom:2px solid var(--line);white-space:nowrap}
  .monthly-table th:first-child{text-align:left}
  .monthly-table td{padding:8px 12px;border-bottom:1px solid var(--line)}
  .monthly-table tbody tr:hover{background:#f8fafc}
  .mtbl-rate{color:var(--mute);font-size:12px;margin-left:4px}
  .mtbl-detail{border:none;background:none;color:var(--acc);padding:0;font-size:12px;cursor:pointer}
  .mtbl-detail:hover{text-decoration:underline}
  /* 品牌变化详情：分行 + 标签三色 + 城市胶囊 */
  .bd-line{margin:3px 0;font-size:13px;line-height:1.7;display:flex;gap:6px}
  .bd-tag{flex-shrink:0;font-weight:700}

  /* ── 更新日志 ── */

const stripSuffix = s => (s||"").replace(/(维吾尔自治区|壮族自治区|回族自治区|自治区|特别行政区|省|市)$/,"");
// 同店匹配用的店名标准化：剥掉业务类型尾词、括号备注、破折号备注、空白
// 解决: 小米/特斯拉/小鹏 类型互换 (城市展厅↔交付中心↔服务中心)、奥迪 (xxx开业)/——二手车展厅、鸿蒙智行 前导空格
function normName(s){
  if(!s) return '';
  let n = String(s).replace(/\s+/g,'').trim();
  // 砍括号备注
  n = n.replace(/[（(][^）)]*[)）]/g,'');
  // 砍破折号备注 (—— / -- / -)
  n = n.replace(/[—\-]{1,2}.*$/,'');
  // 砍鸿蒙智行子品牌词 (同物理网点会在尚界/智界等之间切换归属标注)
  n = n.replace(/(问界|智界|享界|尊界|尚界)/g,'');
  // 反复砍尾部业务类型词
  const TYPES = ['城市展厅','交付中心','服务中心','销售中心','销售展厅','体验店','体验中心','用户中心','交付服务中心','销售服务中心','展厅','中心'];
  let prev=null;
  while(prev!==n){ prev=n;
    for(const t of TYPES){ if(n.endsWith(t)){ n=n.slice(0,-t.length); break; } }
  }
  return n;
}
const fmtTs = s => (s||"").replace(/^(\d{4})(\d{2})(\d{2})$/, '$1/$2/$3');
const TIERS = ['一线','二线','三线','四线','五线','未分级'];
const GROUP_SUBS = {

let DATA, CUR, PREV, PREV2=null, MANIFEST=null, SNAP_CACHE={}, LOC_CACHE={}, REPORT_DATA_CACHE={}, RENDER_SEQ=0, REPORT_PAIR=null, mapChart, trendChart, provMapChart, jieStoreChart, jieSubChart, mbTagChart, penChart, mapLoaded=false;

async function ensureSnap(ts){
  if(!ts) return null;
  if(SNAP_CACHE[ts]) return SNAP_CACHE[ts];
  const meta = DATA.snapshots.find(s=>s.ts===ts);
  if(!meta) return null;
  if(meta.dealers){
    SNAP_CACHE[ts] = meta;
    return meta;
  }
  if(!meta.href) throw new Error(`缺少 ${ts} 明细路径`);
  // 明细文件按期命名、内容基本不可变，走浏览器缓存 + ETag 协商（重发布后 ETag 变化自动拉新）；
  // 曾经的 no-store 让每次访问都全量重下 ~750KB/期，是首屏慢的主因
  const r = await fetch(meta.href);
  const snap = await r.json();
  if(snap.columns && snap.rows){
    snap.dealers = snap.rows.map(row => {
      const obj = {};
      snap.columns.forEach((k, i) => { obj[k] = row[i] == null ? '' : row[i]; });
      return obj;
    });
    delete snap.rows;
  }
  SNAP_CACHE[ts] = snap;
  meta.dealers = snap.dealers;  // 回填到 DATA.snapshots 原始条目，trendSeriesData() 等按 s.dealers 遍历全期的逻辑才能读到
  return snap;
}

async function ensureLocations(ts){
  if(LOC_CACHE[ts]) return LOC_CACHE[ts];
  const snap = await ensureSnap(ts);
  const locs = buildLocations(snap.dealers);
  LOC_CACHE[ts] = locs;
  return locs;
}

async function loadManifest(){

function _scopeReportCss(css){
  return css.replace(
    /([^{}@][^{}]*)\{/g,
    (m, sel) => sel.split(',').flatMap(s=>[`#reportBody ${s.trim()}`, `#monthlyBody ${s.trim()}`]).join(',') + '{'
  );
}

async function ensureReportStyle(){
  if(document.getElementById('_rStyle')) return;
  if(window.__REPORT_CSS__){
    const scoped = _scopeReportCss(window.__REPORT_CSS__);
    const s = document.createElement('style'); s.id='_rStyle';
    s.textContent = scoped; document.head.appendChild(s);
    return;
  }
  const manifest = await loadManifest();
  if(manifest.reportHtml){
    try{
      const r = await fetch(manifest.reportHtml);
      const html = await r.text();
      const css = (html.match(/<style>([\s\S]*?)<\/style>/i)||[])[1];
      if(css && !document.getElementById('_rStyle')){
        const s = document.createElement('style'); s.id='_rStyle';
        s.textContent = _scopeReportCss(css); document.head.appendChild(s);
      }
    }catch(e){}
  }
}

function reportPairs(){
  const snaps = DATA.snapshots || [];
  const out = [];
  for(let i=1;i<snaps.length;i++){
    out.push({oldTs:snaps[i-1].ts, newTs:snaps[i].ts, label:`${fmtTs(snaps[i-1].ts)} - ${fmtTs(snaps[i].ts)}`});
  }
  return out;
}
function nextMonthKey(yyyymm){
  const y = Number(yyyymm.slice(0,4));
  const m = Number(yyyymm.slice(4,6));
  const d = new Date(y, m, 1);
  return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}`;
}
function firstMondayTs(yyyymm){
  const y = Number(yyyymm.slice(0,4));
  const m = Number(yyyymm.slice(4,6)) - 1;
  const d = new Date(y, m, 1);
  const add = (8 - d.getDay()) % 7;
  d.setDate(1 + add);
  return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
}
function monthLabel(yyyymm){ return `${yyyymm.slice(0,4)}年${Number(yyyymm.slice(4,6))}月`; }
function monthlyPairs(){
  const snaps = [...(DATA.snapshots || [])].sort((a,b)=>a.ts.localeCompare(b.ts));
  const firstByMonth = {};
  for(const s of snaps){
    const ym = s.ts.slice(0,6);
    if(!firstByMonth[ym]) firstByMonth[ym] = s.ts;
  }
  return Object.keys(firstByMonth).sort().map(ym=>{
    const nextYm = nextMonthKey(ym);
    const newTs = firstByMonth[nextYm] || null;
    const expectedTs = firstMondayTs(nextYm);
    return {
      month: ym,
      oldTs: firstByMonth[ym],
      newTs,
      expectedTs,
      label: newTs ? `${monthLabel(ym)}｜${fmtTs(firstByMonth[ym])} - ${fmtTs(newTs)}` : `${monthLabel(ym)}｜${fmtTs(firstByMonth[ym])} → 待 ${fmtTs(expectedTs)} 更新`,
    };
  });
}
function prewarmReports(){
  const run = async () => {
    try{
      const rp = reportPairs().at(-1);
      if(rp) await computePairReportData(rp.oldTs, rp.newTs);
      const mp = monthlyPairs().at(-1);
      if(mp){
        if(mp.newTs){
          await computePairReportData(mp.oldTs, mp.newTs);
        } else if(DATA.snapshots && DATA.snapshots.length){
          await Promise.all([ensureLocations(mp.oldTs), ensureLocations(DATA.snapshots.at(-1).ts)]);
        }
      }
    }catch(e){}
  };
  if('requestIdleCallback' in window) requestIdleCallback(run, {timeout:2000});
  else setTimeout(run, 300);
}
function reportDateText(ts){ return `${ts.slice(0,4)}年${ts.slice(4,6)}月${ts.slice(6)}日`; }
function reportDeltaHtml(v, suffix=''){
  if(v>0) return `<span class="pos">+${v}${suffix}</span>`;
  if(v<0) return `<span class="neg">${v}${suffix}</span>`;
  return `<span class="zero">—</span>`;
}
function reportNameList(rows, limit=3){
  const items = (rows||[]).filter(x=>x && x.n);
  if(!items.length) return '';
  // 同名门店（如销售/服务同名）在名称后标注性质以区分
  const freq = {};
  items.forEach(x=>{ freq[x.n] = (freq[x.n]||0)+1; });
  const names = items.map(x=> (freq[x.n]>1 && x.t) ? `${x.n}（${x.t}）` : x.n);
  return names.slice(0, limit).join('、') + (names.length>limit ? '等' : '');
}
// 把预计算 view 还原成 renderers 期望的 data 形状
function _hydrateView(view){
  const rows = view.rows.map(r => ({
    g: r.g,
    cur: new Array(r.curCount).fill({g:r.g}),
    prev: new Array(r.prevCount).fill({g:r.g}),
    curSales: r.curSales,
    prevSales: r.prevSales,
    curAfterSales: r.curAfterSales,
    prevAfterSales: r.prevAfterSales,
    cities: r.cities,
    cityDelta: r.cityDelta,
    salesCities: r.salesCities,
    salesCityDelta: r.salesCityDelta,
    diff: r.diff,
    salesDiff: r.salesDiff || r.diff,
  }));
  // curLocs 仅在 renderDynamicReport/renderMonthlyReport 里被取 length 和 map(l=>l.g) 用作品牌数
  const curLocs = view.rows.flatMap(r => new Array(r.curCount).fill(0).map(()=>({g:r.g})));
  const prevLocs = view.rows.flatMap(r => new Array(r.prevCount).fill(0).map(()=>({g:r.g})));
  return {
    curLocs, prevLocs,
    allDiff: view.allDiff,
    rows,
    totalDelta: view.curTotal - view.prevTotal,
  };
}
async function _tryFetchView(oldTs, newTs){
  // 离线 standalone 内联在 window.__VIEWS__
  const key = `${oldTs}_vs_${newTs}`;
  if(window.__VIEWS__ && window.__VIEWS__[key]) return window.__VIEWS__[key];
  try{
    const r = await fetch(`data/views/report_${oldTs}_vs_${newTs}.json`);
    if(!r.ok) return null;
    return await r.json();
  }catch(e){ return null; }
}
async function computePairReportData(oldTs, newTs){
  const key = `${oldTs}|${newTs}`;
  if(REPORT_DATA_CACHE[key]) return REPORT_DATA_CACHE[key];
  const view = await _tryFetchView(oldTs, newTs);
  // 无预计算 view 时前端现算回退（口径与 precompute_views.mjs buildReportView 一致，含二期确认制）
  const data = view ? _hydrateView(view) : await _computeViewLocal(oldTs, newTs);
  REPORT_DATA_CACHE[key] = data;
  return data;
}
// P043：确认口径包装——老字段结构不变，added/removed 换成带 ret/obs 标记的版本
function _confirmedDiffLocal(diff, conf){
  if(!conf) return diff;
  return {...diff, added: conf.added, removed: conf.removed, removedConfirmed: conf.removedConfirmed, confirm: conf.counts};
}
// P043：无 view 时的前端现算回退路径（与 mjs buildReportView 同口径；直接产出 _hydrateView 形状）
async function _computeViewLocal(oldTs, newTs){
  const [prevLocs, curLocs] = await Promise.all([ensureLocations(oldTs), ensureLocations(newTs)]);
  const all = DATA.snapshots.map(s=>s.ts);
  const oi = all.indexOf(oldTs), ni = all.indexOf(newTs);
  let prev2Locs = null;
  if(ni - oi === 1 && oi >= 1){   // 仅相邻期对启用二期确认；最早两期 / 月度对回退现口径
    try{ prev2Locs = await ensureLocations(all[oi-1]); }catch(e){ prev2Locs = null; }
  }
  const allDiff = pairPeriodChanges(curLocs, prevLocs);
  const allConf = confirmPeriodDiff(allDiff, curLocs, prevLocs, prev2Locs);
  const brands = [...new Set([...curLocs.map(l=>l.g), ...prevLocs.map(l=>l.g)])];
  const rows = brands.map(g=>{
    const cur = curLocs.filter(l=>l.g===g);
    const prev = prevLocs.filter(l=>l.g===g);
    const prev2 = prev2Locs ? prev2Locs.filter(l=>l.g===g) : null;
    const diff = pairPeriodChanges(cur, prev);
    const conf = confirmPeriodDiff(diff, cur, prev, prev2);
    const cities = new Set(cur.map(l=>`${l.p}${l.c}`)).size;
    const prevCities = new Set(prev.map(l=>`${l.p}${l.c}`)).size;
    const curSalesLocs = cur.filter(l=>hasCap(l,'销售'));
    const prevSalesLocs = prev.filter(l=>hasCap(l,'销售'));
    const prev2SalesLocs = prev2 ? prev2.filter(l=>hasCap(l,'销售')) : null;
    const salesDiff = pairPeriodChanges(curSalesLocs, prevSalesLocs);
    const salesConf = confirmPeriodDiff(salesDiff, curSalesLocs, prevSalesLocs, prev2SalesLocs);
    const salesCities = new Set(curSalesLocs.map(l=>`${l.p}${l.c}`)).size;
    const prevSalesCities = new Set(prevSalesLocs.map(l=>`${l.p}${l.c}`)).size;
    return {
      g, cur, prev,
      curSales: curSalesLocs.length, prevSales: prevSalesLocs.length,
      curAfterSales: cur.filter(l=>hasCap(l,'售后')).length,
      prevAfterSales: prev.filter(l=>hasCap(l,'售后')).length,
      cities, cityDelta: cities - prevCities,
      salesCities, salesCityDelta: salesCities - prevSalesCities,
      diff: _confirmedDiffLocal(diff, conf),
      salesDiff: _confirmedDiffLocal(salesDiff, salesConf),
    };
  }).sort((a,b)=>b.cur.length-a.cur.length);
  return {
    curLocs, prevLocs,
    allDiff: _confirmedDiffLocal(allDiff, allConf),
    rows,
    totalDelta: curLocs.length - prevLocs.length,
  };
}
// 超豪品牌：网点少、平时基本不动；默认在报告表格/图表中隐藏，仅当本期有变化时才显示
const SUPER_LUX_BRANDS = new Set(['宾利','劳斯莱斯','法拉利','兰博基尼','阿斯顿·马丁']);
function _rowHasChange(r){
  // 超豪品牌的显示判断只看真实的开店/关店（新增/退出/确认退出）；
  // 仅"名称/地址变更"（多为行政区划码抖动等噪音）不算有变化，避免无意义地放进来
  return r.diff.added.length > 0 || r.diff.removed.length > 0 || (r.diff.removedConfirmed||[]).length > 0;
}
function visibleReportRows(rows){
  return rows.filter(r => !SUPER_LUX_BRANDS.has(r.g) || _rowHasChange(r));
}
function renderReportRows(rows){
  // 净变化=0 的品牌（月初=月末，如本期理想/奔驰）默认不显示；这里的"销售网点数"口径统一按
  // curSales/prevSales/salesCities/salesDiff（hasCap 销售），跟服务/钣喷网点区分开，见 P037。
  // P043：有确认退出（发生在 T-2→T-1、总数早已回落）的品牌即使本期销售数持平也要露出。
  rows = rows.filter(r => r.curSales !== r.prevSales || ((r.salesDiff||r.diff).removedConfirmed||[]).length);
  return rows.map((r,i)=>{
    const salesDiff = r.salesDiff || r.diff;
    // P043 确认口径计数照旧（新增剔除回归、退出用确认名单），但观察中/回归不在对外报告露出
    // （用户确认：报告读者无口径上下文，标注反生歧义；机制细节见「口径说明」页）
    const sc = salesDiff.confirm || null;
    const add = reportNameList(sc ? salesDiff.added.filter(x=>!x.ret) : salesDiff.added);
    const rem = reportNameList(sc ? (salesDiff.removedConfirmed||[]) : salesDiff.removed);
    const changeDetail = [
      add ? `<div class="detail-add">+新增 ${add}</div>` : '',
      rem ? `<div class="detail-rem">−退出 ${rem}</div>` : '',
    ].join('');
    return `<tr>

      <td class="num">${r.curSales}</td>

      <td class="num">${r.salesCities!=null?r.salesCities:r.cities}</td>
      <td class="num">${reportDeltaHtml(r.salesCityDelta!=null?r.salesCityDelta:r.cityDelta)}</td>
      <td class="detail-cell">${changeDetail || '<span class="zero">—</span>'}</td>
    </tr>`;
  }).join('');
}
function renderReportBrandDetails(rows, opts){
  const showChanged = !opts || opts.showChanged !== false;   // 当期报告传 {showChanged:false} 隐藏名称/地址变更
  // P043：确认口径计数（新增剔除回归、退出用确认名单），观察中/回归明细不对外露出——
  // 报告读者无口径上下文易生歧义；完整分类见网点查询页与「口径说明」（用户确认的呈现策略）
  return rows.filter(r=>{
    const d = r.diff, c = d.confirm || null;
    const nAdd = c ? d.added.filter(x=>!x.ret).length : d.added.length;
    const nRem = c ? (d.removedConfirmed||[]).length : d.removed.length;
    return nAdd || nRem || (showChanged && d.changed.length);
  }).map(r=>{
    const d = r.diff, c = d.confirm || null;
    const addedC = c ? d.added.filter(x=>!x.ret) : d.added;
    const remC   = c ? (d.removedConfirmed||[]) : d.removed;
    const net = r.cur.length - r.prev.length;
    const lines = [`<div class="bd-line"><span class="bd-tag bd-net">净变化</span><span class="bd-names">${reportDeltaHtml(net, ' 家')}</span></div>`];
    if(addedC.length) lines.push(`<div class="bd-line"><span class="bd-tag bd-add">新增</span><span class="bd-names">${reportNameList(addedC, 8)}</span></div>`);
    if(remC.length)   lines.push(`<div class="bd-line"><span class="bd-tag bd-rem">退出</span><span class="bd-names">${reportNameList(remC, 8)}</span></div>`);
    if(showChanged && d.changed.length) lines.push(`<div class="bd-line"><span class="bd-tag bd-chg">名称/地址变更</span><span class="bd-names">${reportNameList(d.changed, 6)}</span></div>`);
    return `<div class="brand-block">
      <h3>${r.g}</h3>
      ${lines.join('')}
    </div>`;
  }).join('') || '<p style="color:var(--mute)">本期无品牌变化详情</p>';
}

function buildMonthlySummary(pair, rows, allDiff, curTotal, prevTotal, citiesNet){
  const netOf = r => r.cur.length - r.prev.length;
  const sorted = [...rows].sort((a,b)=>netOf(b)-netOf(a));
  const totalNet = curTotal - prevTotal;
  const pct = prevTotal ? (totalNet/prevTotal*100) : 0;
  const up = rows.filter(r=>netOf(r)>0), down = rows.filter(r=>netOf(r)<0);
  const topUp = sorted[0], topDown = sorted[sorted.length-1];
  const mostAdded = [...rows].sort((a,b)=>b.diff.added.length-a.diff.added.length)[0];
  const dir = totalNet>0 ? '净增' : totalNet<0 ? '净减' : '持平';
  const paragraph =
    `本月（${fmtTs(pair.oldTs)} → ${fmtTs(pair.newTs)}），竞对汽车品牌销售网点由月初 <b>${prevTotal.toLocaleString()}</b> 家变为月末 <b>${curTotal.toLocaleString()}</b> 家，`
    + `${dir} <b>${Math.abs(totalNet)}</b> 家（${reportDeltaHtml(Number(pct.toFixed(1)),'%')}）。`
    + `期间 <b>${up.length}</b> 个品牌扩张、<b>${down.length}</b> 个品牌收缩；`
    + `新进 <b>${allDiff.added.length}</b> 家、退出 <b>${allDiff.removed.length}</b> 家，另有 <b>${allDiff.changed.length}</b> 条名称/地址更新，覆盖城市${citiesNet>=0?'净增':'净减'} <b>${Math.abs(citiesNet)}</b> 个。`;
  const bullets = [];
  if(topUp && netOf(topUp)>0)
    bullets.push(`扩张最快：<b>${topUp.g}</b> ${reportDeltaHtml(netOf(topUp),' 家')}（月末 ${topUp.cur.length} 家）`);
  if(topDown && netOf(topDown)<0)
    bullets.push(`收缩最多：<b>${topDown.g}</b> ${reportDeltaHtml(netOf(topDown),' 家')}（月末 ${topDown.cur.length} 家）`);
  if(mostAdded && mostAdded.diff.added.length)
    bullets.push(`新开门店最多：<b>${mostAdded.g}</b>，新增 <b>${mostAdded.diff.added.length}</b> 家（${reportNameList(mostAdded.diff.added, 3)}）`);
  bullets.push(`整体节奏：${up.length>down.length?'扩张品牌多于收缩品牌，渠道仍在铺开':down.length>up.length?'收缩品牌多于扩张品牌，渠道有所收敛':'扩张与收缩品牌数量相当，渠道总体平稳'}。`);
  return { paragraph, bullets };
}

// ── 月度报告：各品牌月度变化大表 ────────────────────────────────────
function buildMonthlyTable(rows){
  const netOf = r => r.cur.length - r.prev.length;
  // 只列净变化≠0 的品牌（法拉利/宝马这种月初=月末的不进表）
  const visible = rows.filter(r => netOf(r) !== 0)
                      .sort((a,b)=>netOf(b)-netOf(a));
  if(!visible.length) return '<p style="color:var(--mute);padding:16px 0">本月没有品牌的网点总数发生变化。</p>';
  const body = visible.map(r=>{
    const cur=r.cur.length, prev=r.prev.length, net=cur-prev;
    const rate = prev ? (net/prev*100) : (net>0?100:0);
    const rateTxt = `${reportDeltaHtml(net)} <span class="mtbl-rate">${net>0?'+':''}${rate.toFixed(1)}%</span>`;
    return `<tr>
      <td class="brand-cell"><span class="dot" style="background:${trendGroupColorOf(r.g)}"></span>${r.g}</td>
      <td class="num">${prev.toLocaleString()}</td>
      <td class="num">${r.prevSales!=null?r.prevSales.toLocaleString():'—'}</td>
      <td class="num">${cur.toLocaleString()}</td>
      <td class="num">${r.curSales!=null?r.curSales.toLocaleString():'—'}</td>
      <td class="num">${rateTxt}</td>
      <td class="num"><button class="mtbl-detail" data-brand="${r.g}">查看</button></td>
    </tr>`;
  }).join('');
  return `<table class="monthly-table">
    <thead><tr>
      <th style="width:120px">品牌</th>
      <th class="num">月初总网点数</th><th class="num">月初销售网点总数</th>
      <th class="num">月末总网点数</th><th class="num">月末销售网点总数</th>
      <th class="num">净变化 / 变化率</th><th class="num" style="width:72px">详情</th>
    </tr></thead>
    <tbody>${body}</tbody>
  </table>`;
}

// ── 品牌变化详情：城市新增/退出胶囊，新增一行、退出一行 ──────────────
function _cityPills(diff){
  const short = x => String(x.c||x.p||'其他').replace(/市$/,'');
  const add={}, rem={};
  (diff.added||[]).forEach(x=>{ const c=short(x); add[c]=(add[c]||0)+1; });
  (diff.removed||[]).forEach(x=>{ const c=short(x); rem[c]=(rem[c]||0)+1; });
  const addRow=Object.entries(add).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<span class="city-pill pos">${c} +${v}</span>`).join('');
  const remRow=Object.entries(rem).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<span class="city-pill neg">${c} -${v}</span>`).join('');
  let h='';
  if(addRow) h+=`<div class="bd-pillrow">${addRow}</div>`;
  if(remRow) h+=`<div class="bd-pillrow">${remRow}</div>`;
  return h;
}

// ── 月度报告：点击品牌 → 弹窗看本月新增/退出/变更明细（仿可视化明细表）──
function openBrandDetailModal(brand){
  const row = (MONTHLY_ROWS||[]).find(r=>r.g===brand);
  if(!row) return;
  const tag = (arr,status)=> (arr||[]).map(x=>({status, ...x}));
  const data = [...tag(row.diff.added,'新增'), ...tag(row.diff.removed,'退出'), ...tag(row.diff.changed,'变更')];

  let mask = document.getElementById('brandModal');
  if(!mask){ mask = document.createElement('div'); mask.id='brandModal'; mask.className='modal-mask'; document.body.appendChild(mask); }
  mask.innerHTML = `<div class="modal-card">
    <div class="modal-head">
      <div><b>${brand}</b> · 本月网点变化　<span style="color:var(--mute);font-weight:400;font-size:13px">${period}</span></div>
      <button class="modal-x" aria-label="关闭">×</button>
    </div>
    <input class="modal-search" placeholder="搜索名称 / 地址 / 城市 …">
    <div class="modal-body"><table class="modal-table">
      <thead><tr><th>状态</th><th>名称</th><th>大区</th><th>省/市</th><th>等级</th><th>类型</th><th>地址</th></tr></thead>
      <tbody></tbody></table></div>
  </div>`;
  mask.style.display = 'flex';
  const render = (q='')=>{
    const ql = q.trim().toLowerCase();
    const list = ql ? data.filter(r=>(r.n||'').toLowerCase().includes(ql)||(r.a||'').toLowerCase().includes(ql)||(r.c||'').toLowerCase().includes(ql)||(r.p||'').toLowerCase().includes(ql)) : data;
    const tb = mask.querySelector('.modal-table tbody');
    if(!list.length){ tb.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--mute);padding:24px">无数据</td></tr>'; return; }
    tb.innerHTML = list.map(r=>{
      const cls = r.status==='新增'?'add':r.status==='退出'?'del':'';
      const oldBits = [];
      if(r.oldName && r.oldName!==r.n) oldBits.push(`原名称：${r.oldName}`);
      if(r.oldAddress && r.oldAddress!==r.a) oldBits.push(`原地址：${r.oldAddress}`);
      const addr = oldBits.length ? `${r.a||''}<div style="font-size:12px;color:#8c959f;margin-top:2px">${oldBits.join('<br>')}</div>` : (r.a||'');
      return `<tr>
        <td><span class="pill ${cls}">${r.status}</span></td>
        <td>${r.n||''}</td><td>${r.r||''}</td><td>${r.p||''} ${r.c||''}</td>
        <td>${r.lv||''}</td><td>${r.t||''}</td>
        <td style="color:var(--mute)">${addr}</td>
      </tr>`;
    }).join('');
  };
  render();
  const close = ()=>{ mask.style.display='none'; document.removeEventListener('keydown', onEsc); };
  function onEsc(ev){ if(ev.key==='Escape') close(); }
  mask.querySelector('.modal-x').onclick = close;
  mask.onclick = e=>{ if(e.target===mask) close(); };
  mask.querySelector('.modal-search').oninput = e=>render(e.target.value);
  document.addEventListener('keydown', onEsc);
}

function getSnap(ts){ return DATA.snapshots.find(s=>s.ts===ts); }
// 物理网点去重键: 原始名+省+地址（保留括号，避免同省同类型不同商场被误合并）
// 剥掉地址末尾被流水线追加的邮编/行政区划码（5-6 位），它在不同期间会抖动，
// 会把同一家店误判成“退出+新增→地址变更”。仅用于跨期比对，不影响总数/去重展示。
function _stripTailCode(a){ return String(a||'').replace(/\s*\d{5,6}\s*$/,'').trim(); }
// 鸿蒙同店双名（P042）：前缀是店型（尚界用户中心/授权用户中心/AITO…），•后地点段才是身份
function himaLoc(n){ const s=String(n||''); const i=s.search(/[·•]/); const loc=i>=0?s.slice(i+1).replace(/\s+/g,''):''; return loc||null; }
function locKey(x){
  if(x.g==='鸿蒙智行'){ const loc=himaLoc(x.n); if(loc) return `${x.g}||${loc}||${stripSuffix(x.p)}||`; }
  return `${x.g}||${x.n}||${stripSuffix(x.p)}||${x.a||''}`;
}
// P042/P043：鸿蒙同店双名跨期也按•地点段认店（与 precompute_views.mjs lkLoc 一致——
// 此前客户端 lkLoc 漏掉该分支，导致网点查询页把同店换牌算成一退一增，与当期报告 view 数字对不上）
function lkLoc(l){
  if(l.g==='鸿蒙智行'){ const loc=himaLoc(l.n); if(loc) return `${l.g}||${loc}||${l.p}||`; }
  return `${l.g}||${l.n}||${l.p}||${_stripTailCode(l.a)}`;
}
function capSet(x){
  const raw = String(x && x.cap || '').split('|').map(s=>s.trim()).filter(Boolean);
  if(raw.length) return new Set(raw);
  const t = String(x && x.t || '');
  if(t === '销售') return new Set(['S']);
  if(t === '联合店') return new Set(['S','A']);
  if(['服务','钣喷'].includes(t)) return new Set(['A']);
  return new Set();
}
function hasCap(x, label){
  const caps = x && x.caps instanceof Set ? x.caps : capSet(x);
  return label === '销售' ? caps.has('S') : label === '售后' ? caps.has('A') : false;
}
function passesCapabilityFilter(x){
  if(!SEL_CATS.size) return true;
  for(const c of SEL_CATS) if(hasCap(x, c)) return true;
  return false;
}

function _addrClean(a){
  return String(a||'').replace(/\s+/g,'').replace(/[，。、（）()【】\[\]·•\-—_]/g,'');
}
function _districtOf(l){
  const a = _addrClean(l.a);
  const m = a.match(/([\u4e00-\u9fa5]{2,8})(区|县|旗)/);
  return m ? m[1] + m[2] : '';
}
function _roadDoorOf(l){
  const a = _addrClean(l.a);
  const m = a.match(/([\u4e00-\u9fa5A-Za-z0-9]{1,16}(?:大道|大街|路|街|道|巷|弄))([0-9一二三四五六七八九十百]+号?)/);
  return m ? m[1] + m[2] : '';
}
function _addrSimilarity(a, b){
  const sa = new Set(_addrClean(a).split(''));
  const sb = new Set(_addrClean(b).split(''));
  if(!sa.size && !sb.size) return 1;
  if(!sa.size || !sb.size) return 0;
  let inter = 0;
  for(const x of sa) if(sb.has(x)) inter++;
  return inter / new Set([...sa, ...sb]).size;
}
function _addrPrefixNorm(a){
  return String(a||'').replace(/\s+/g,'').replace(/(北京市|天津市|上海市|重庆市|河北省|山西省|辽宁省|吉林省|黑龙江省|江苏省|浙江省|安徽省|福建省|江西省|山东省|河南省|湖北省|湖南省|广东省|海南省|四川省|贵州省|云南省|陕西省|甘肃省|青海省|台湾省|内蒙古自治区|广西壮族自治区|西藏自治区|宁夏回族自治区|新疆维吾尔自治区|香港特别行政区|澳门特别行政区|内蒙古|广西|西藏|宁夏|新疆|香港|澳门)/g,'').slice(0,16);
}
function _nameSimilarity(a, b){
  const aa = new Set(normName(a).split(''));
  const bb = new Set(normName(b).split(''));
  if(!aa.size && !bb.size) return 1;
  if(!aa.size || !bb.size) return 0;
  let inter = 0;
  for(const x of aa) if(bb.has(x)) inter++;
  return inter / new Set([...aa, ...bb]).size;
}
function _isAddressUpdate(a, r){
  if(a.g !== r.g) return false;
  if(String(a.n||'').trim() !== String(r.n||'').trim()) return false;
  if(stripSuffix(a.p) !== stripSuffix(r.p)) return false;
  if((a.c||'') !== (r.c||'')) return false;
  const da = _districtOf(a), dr = _districtOf(r);
  if(da && dr && da !== dr) return false;
  const ra = _roadDoorOf(a), rr = _roadDoorOf(r);
  if(ra && rr && ra === rr) return true;
  return _addrSimilarity(a.a, r.a) >= 0.62;
}
function _sameNameCityKey(x){
  return `${x.g}||${String(x.n||'').trim()}||${stripSuffix(x.p)}||${x.c||''}`;
}
function pairPeriodChanges(curLocs, prevLocs){
  if(!prevLocs) return {added:[], removed:[], changed:[]};
  const ck = new Set(curLocs.map(lkLoc)), pk = new Set(prevLocs.map(lkLoc));
  let added = curLocs.filter(l => !pk.has(lkLoc(l)));
  let removed = prevLocs.filter(l => !ck.has(lkLoc(l)));
  const addNameCityCount = new Map();
  const remNameCityCount = new Map();
  for(const a of added) addNameCityCount.set(_sameNameCityKey(a), (addNameCityCount.get(_sameNameCityKey(a))||0)+1);
  for(const r of removed) remNameCityCount.set(_sameNameCityKey(r), (remNameCityCount.get(_sameNameCityKey(r))||0)+1);
  const used = new Set();
  const changed = [];
  const keptAdded = [];
  for(const a of added){
    let best = null, bestScore = -1;
    for(const r of removed){
      const rk = lkLoc(r);
      if(used.has(rk)) continue;
      const oneToOneSameNameCity = (
        _sameNameCityKey(a) === _sameNameCityKey(r) &&
        addNameCityCount.get(_sameNameCityKey(a)) === 1 &&
        remNameCityCount.get(_sameNameCityKey(r)) === 1
      );
      if(!oneToOneSameNameCity && !_isAddressUpdate(a, r)) continue;
      const score = (oneToOneSameNameCity ? 2 : 0) + (_roadDoorOf(a) && _roadDoorOf(a) === _roadDoorOf(r) ? 1 : 0) + _addrSimilarity(a.a, r.a);
      if(score > bestScore){ bestScore = score; best = r; }
    }
    if(best){
      used.add(lkLoc(best));
      changed.push({...a, oldAddress:best.a, oldName:best.n, changeType:'地址变更'});
    } else {
      keptAdded.push(a);
    }
  }
  let remainingAdded = keptAdded;
  let remainingRemoved = removed.filter(r => !used.has(lkLoc(r)));
  const pairExtra = (kind) => {
    const nextAdded = [];
    for(const a of remainingAdded){
      let best = null, bestScore = -1;
      for(const r of remainingRemoved){
        const rk = lkLoc(r);
        if(used.has(rk)) continue;
        if(a.g !== r.g || stripSuffix(a.p) !== stripSuffix(r.p)) continue;
        let ok = false, score = 0;
        if(kind === 'addr'){
          const ap = _addrPrefixNorm(a.a), rp = _addrPrefixNorm(r.a);
          ok = !!ap && ap === rp;
          score = ok ? 1 + _nameSimilarity(a.n, r.n) : 0;
        } else {
          score = _nameSimilarity(a.n, r.n);
          ok = score >= 0.75;
        }
        if(ok && score > bestScore){ bestScore = score; best = r; }
      }
      if(best){
        used.add(lkLoc(best));
        changed.push({
          ...a,
          oldAddress:best.a,
          oldName:best.n,
          changeType: a.n === best.n ? '地址变更' : '店名变更'
        });
      } else {
        nextAdded.push(a);
      }
    }
    remainingAdded = nextAdded;
    remainingRemoved = removed.filter(r => !used.has(lkLoc(r)));
  };
  pairExtra('addr');
  pairExtra('name');
  return {
    added: remainingAdded,
    removed: remainingRemoved,
    changed,
  };
}

// P043 二期确认制（仅相邻期对比启用；与 precompute_views.mjs 逐字一致，改动必须双向同步）：
//  - 新增(确认)   ∈T 且 ∉T-1 且 ∉T-2；∈T-2(严格仅隔一期回归) 打 ret 标不计新增
//  - 疑似退出     ∈T-1 且 ∉T（本期首缺）→ obs 标观察中，不计退出头数
//  - 确认退出     ∈T-2 且 ∉T-1 且 ∉T，且 T-1/T 无同店存活（同名同城 / 名称高相似 / 地址前缀同）
//  缺口≥2期后回归按新增计（其退网已在更早报告确认过）；网点总数一律实抓不动。
function confirmPeriodDiff(diff, curLocs, prevLocs, prev2Locs){
  if(!prev2Locs) return null;
  const p2k = new Set(prev2Locs.map(lkLoc));
  const pk  = new Set(prevLocs.map(lkLoc));
  const ck  = new Set(curLocs.map(lkLoc));
  const added   = diff.added.map(a => p2k.has(lkLoc(a)) ? {...a, ret:true} : a);
  const removed = diff.removed.map(r => ({...r, obs:true}));
  // 存活索引：T-1 ∪ T 按 品牌||省 分桶 + 同名同城精确键，确认判定只在小候选桶里做相似比对
  const aliveBy = new Map();
  const aliveNameCity = new Set();
  for(const l of [...prevLocs, ...curLocs]){
    const b = `${l.g}||${l.p}`;
    if(!aliveBy.has(b)) aliveBy.set(b, []);
    aliveBy.get(b).push(l);
    aliveNameCity.add(_sameNameCityKey(l));
  }
  const removedConfirmed = [];
  for(const r of prev2Locs){
    const k = lkLoc(r);
    if(pk.has(k) || ck.has(k)) continue;                      // T-1 或 T 仍在营
    if(aliveNameCity.has(_sameNameCityKey(r))) continue;      // 同名同城存活（地址变更）
    let alive = false;
    const rp = _addrPrefixNorm(r.a);
    for(const l of (aliveBy.get(`${r.g}||${r.p}`) || [])){
      if(_nameSimilarity(r.n, l.n) >= 0.75){ alive = true; break; }   // 同店改名仍在营
      if(rp && rp === _addrPrefixNorm(l.a)){ alive = true; break; }   // 同址换牌仍在营
    }
    if(!alive) removedConfirmed.push(r);
  }
  const retN = added.filter(x=>x.ret).length;
  return { added, removed, removedConfirmed,
    counts: { added: added.length - retN, ret: retN, obs: removed.length, removed: removedConfirmed.length } };
}

// 把行级 dealers 折叠成 location 列表
function buildLocations(dealers){
  const m = new Map();
  for(const d of dealers){
    const k = locKey(d);
    let l = m.get(k);
    if(!l){
      l = {r:d.r, p:stripSuffix(d.p), c:d.c, lv:d.lv, g:d.g, n:d.n, t:d.t, a:d.a, ph:d.ph,
           lng:d.lng||'', lat:d.lat||'', d:d.d||'', subs:new Set(), caps:new Set()};
      m.set(k, l);
    }
    l.subs.add(d.b);
    if(!l.lng && d.lng){ l.lng=d.lng; l.lat=d.lat; l.d=d.d||''; }
    capSet(d).forEach(c=>l.caps.add(c));
  }
  return [...m.values()];
}

// 只应用全局筛选(cat/region/tier)，不应用品牌/子品牌 —— 用于品牌 chip 的计数
function filterGlobal(dealers){
  let list = dealers;
  if(SEL_CATS.size)    list = list.filter(d=>passesCapabilityFilter(d));
  if(SEL_REGIONS.size) list = list.filter(d=>SEL_REGIONS.has(d.r));
  if(SEL_TIERS.size)   list = list.filter(d=>SEL_TIERS.has(d.lv));
  if(SEL_PROVS.size)   list = list.filter(d=>SEL_PROVS.has(stripSuffix(d.p)));
  if(SEL_CITIES.size)  list = list.filter(d=>SEL_CITIES.has(getPrefCity(d)));
  // 县级市钻取: 单选地级市 + 该市有县级子市 + COUNTY_CHECKED 非空 → 进一步限定
  const _ap = SEL_CITIES.size===1 ? [...SEL_CITIES][0] : '';
  if(_ap && CITY_SUBS[_ap] && COUNTY_CHECKED && COUNTY_CHECKED.size>0){
    list = list.filter(d=>getPrefCity(d)!==_ap || COUNTY_CHECKED.has(d.c));
  }
  return list;
}

// 应用所有筛选
function filterAll(dealers){
  let list = filterGlobal(dealers);
  if(SEL_BRANDS.size) list = list.filter(d=>SEL_BRANDS.has(d.g));
  let locs = buildLocations(list);
  const ab = ACTIVE_BRAND_VAL();
  if(ab && GROUP_SUBS[ab] && SUB_CHECKED){
    locs = locs.filter(l => [...l.subs].some(s => SUB_CHECKED.has(s)));
  }
  return locs;
}

function groupCounts(dealers){
  const list = filterGlobal(dealers);
  const seen = {};
  for(const d of list){
    if(!seen[d.g]) seen[d.g]=new Set();
    seen[d.g].add(`${d.n}||${stripSuffix(d.p)}||${d.a||''}`);
  }
  const out={}; for(const g in seen) out[g]=seen[g].size;
  return out;
}

/* ============ 胶囊下拉: 展开/收起 + 与隐藏 <select> 同步 ============ */
function closeAllDD(){ document.querySelectorAll('.dd.open').forEach(d=>d.classList.remove('open')); }
// 动态插入的 .dd（报告/月度区间、数据下载）不在 boot() 时 setupDropdownToggles() 的扫描范围内，
// 每次渲染完都要单独绑一次开合；抽成公用函数避免每处各写一份重复逻辑。
function bindDDToggle(dd){
  if(!dd || dd._ddToggleBound) return;
  dd._ddToggleBound = true;
  dd.addEventListener('click', e=>{
    if(e.target.closest('.dd-pop')) return;
    const wasOpen = dd.classList.contains('open');
    closeAllDD();
    if(!wasOpen) dd.classList.add('open');
    e.stopPropagation();
  });
  const pop = dd.querySelector('.dd-pop');
  if(pop) pop.addEventListener('click', e=>e.stopPropagation());
}
function setupDropdownToggles(){
  document.querySelectorAll('.dd').forEach(dd=>{
    dd.addEventListener('click', e=>{
      if(e.target.closest('.dd-pop')) return;  // popover 内部点击不切换
      const wasOpen = dd.classList.contains('open');
      closeAllDD();
      if(!wasOpen) dd.classList.add('open');
      e.stopPropagation();
    });
  });
  // popover 内部点击 (多选 chip 等) 不冒泡到 document, 避免被 closeAll 关闭
  document.querySelectorAll('.dd-pop').forEach(p=>p.addEventListener('click', e=>e.stopPropagation()));
  document.addEventListener('click', closeAllDD);
}
function setupSelectDropdown(selId, popId, valId){
  const sel = document.getElementById(selId);
  const pop = document.getElementById(popId);
  const val = document.getElementById(valId);
  function build(){
    pop.innerHTML = `<div class="dd-pop-inner">${[...sel.options].map(o=>
      `<div class="opt ${o.value===sel.value?'sel':''}" data-v="${o.value}">${o.textContent}</div>`
    ).join('')}</div>`;
    pop.querySelectorAll('.opt').forEach(o=>o.onclick=ev=>{
      ev.stopPropagation();
      sel.value = o.dataset.v;
      sel.dispatchEvent(new Event('change'));
      build();
      closeAllDD();
    });
    syncLabel();
  }
  function syncLabel(){
    const o = sel.options[sel.selectedIndex];
    val.textContent = o ? o.textContent : '-';
  }
  build();
  sel.addEventListener('change', ()=>{ build(); });
  // expose for refresh after dynamic option add
  sel._ddRebuild = build;
}
/* 日历版下拉 (当前日期/对比日期): 单月网格, 仅有快照的日期可点; 底层仍同步隐藏 <select> */
function setupCalendarDropdown(selId, popId, valId, opts){
  opts = opts || {};
  const sel = document.getElementById(selId);
  const pop = document.getElementById(popId);
  const val = document.getElementById(valId);
  const WK = ['一','二','三','四','五','六','日'];
  let viewYM = null;  // 年*12 + (月-1)
  const avail = () => [...sel.options].map(o=>o.value).filter(v=>/^\d{8}$/.test(v));
  const ymOf  = ts => (+ts.slice(0,4))*12 + (+ts.slice(4,6)-1);
  const defaultYM = () => {
    if(/^\d{8}$/.test(sel.value)) return ymOf(sel.value);
    const a = avail();
    if(a.length) return ymOf(a[a.length-1]);
    const d = new Date(); return d.getFullYear()*12 + d.getMonth();
  };
  function build(){
    if(viewYM==null) viewYM = defaultYM();
    const ar = avail().map(ymOf);
    const minYM = ar.length ? Math.min(...ar) : null;
    const maxYM = ar.length ? Math.max(...ar) : null;
    if(minYM!=null) viewYM = Math.max(minYM, Math.min(maxYM, viewYM));
    const y = Math.floor(viewYM/12), m = viewYM%12;       // m: 0-based
    const availSet = new Set(avail());
    const lead = (new Date(y, m, 1).getDay()+6)%7;         // 周一为首列
    const dim  = new Date(y, m+1, 0).getDate();
    let cells = '';
    for(let i=0;i<lead;i++) cells += '<div class="cal-d empty"></div>';
    for(let d=1; d<=dim; d++){
      const ts = `${y}${String(m+1).padStart(2,'0')}${String(d).padStart(2,'0')}`;
      const has = availSet.has(ts), seld = ts===sel.value;
      cells += `<div class="cal-d ${has?'on':'off'} ${seld?'sel':''}" ${has?`data-v="${ts}"`:''}>${d}</div>`;
    }
    const prevDis = (minYM!=null && viewYM<=minYM) ? 'dis' : '';
    const nextDis = (maxYM!=null && viewYM>=maxYM) ? 'dis' : '';
    const none = opts.allowNone
      ? `<div class="cal-none ${sel.value===''?'sel':''}" data-none="1">不对比</div>` : '';
    pop.innerHTML = `<div class="cal">
      <div class="cal-hd">
        <span class="cal-nav ${prevDis}" data-j="-12">«</span>
        <span class="cal-nav ${prevDis}" data-j="-1">‹</span>
        <span class="cal-title">${y} 年 ${m+1} 月</span>
        <span class="cal-nav ${nextDis}" data-j="1">›</span>
        <span class="cal-nav ${nextDis}" data-j="12">»</span>
      </div>
      <div class="cal-wk">${WK.map(w=>`<span>${w}</span>`).join('')}</div>
      <div class="cal-grid">${cells}</div>${none}</div>`;
    pop.querySelectorAll('.cal-nav').forEach(n=>n.onclick=ev=>{
      ev.stopPropagation();
      if(n.classList.contains('dis')) return;
      viewYM += (+n.dataset.j); build();
    });
    pop.querySelectorAll('.cal-d.on').forEach(c=>c.onclick=ev=>{
      ev.stopPropagation();
      sel.value = c.dataset.v; sel.dispatchEvent(new Event('change'));
      build(); closeAllDD();
    });
    const noneEl = pop.querySelector('.cal-none');
    if(noneEl) noneEl.onclick=ev=>{
      ev.stopPropagation();
      sel.value=''; sel.dispatchEvent(new Event('change'));
      build(); closeAllDD();
    };
    syncLabel();
  }
  function syncLabel(){
    const o = sel.options[sel.selectedIndex];
    val.textContent = o ? o.textContent : (opts.allowNone ? '不对比' : '-');
  }
  build();
  sel.addEventListener('change', ()=>{ viewYM = defaultYM(); build(); });
  sel._ddRebuild = build;
}
function refreshSelectDDs(){
  ['snap','prev'].forEach(id=>{
    const s = document.getElementById(id);
    if(s && s._ddRebuild) s._ddRebuild();

}
function updateFilterDDLabels(){
  const setVal = (id, txt) => { const el = document.getElementById(id); if(el) el.textContent = txt; };
  const lbl = (set) => set.size===0 ? '全部' : (set.size===1 ? [...set][0] : `已选 ${set.size}`);
  setVal('ddCat',    lbl(SEL_CATS));
  setVal('ddRegion', lbl(SEL_REGIONS));
  setVal('ddTier',   lbl(SEL_TIERS));
  setVal('ddProv',   lbl(SEL_PROVS));
  const cityLbl = ()=>{
    if(SEL_CITIES.size===0) return '全部';
    if(SEL_CITIES.size===1){
      const c = [...SEL_CITIES][0];
      if(CITY_SUBS[c] && COUNTY_CHECKED && COUNTY_CHECKED.size>0)
        return [...COUNTY_CHECKED].join(' ');
      return c;
    }
    return `已选 ${SEL_CITIES.size}`;
  };
  setVal('ddCity', cityLbl());
  const brandLbl = ()=>{
    if(SEL_BRANDS.size===0) return '全部';
    if(SEL_BRANDS.size===1){
      const g = [...SEL_BRANDS][0];
      if(GROUP_SUBS[g] && SUB_CHECKED && SUB_CHECKED.size>0)
        return [...SUB_CHECKED].join(' ');
      return g;
    }
    return `已选 ${SEL_BRANDS.size}`;
  };
  setVal('ddBrand', brandLbl());
}

async function render(){
  const seq = ++RENDER_SEQ;
  const curTs = document.getElementById('snap').value;
  const prevTs = document.getElementById('prev').value;
  try{
    CUR  = await ensureSnap(curTs);
    PREV = prevTs ? await ensureSnap(prevTs) : null;
  }catch(e){
    document.getElementById('meta').textContent = '数据加载失败';
    return;
  }
  if(seq !== RENDER_SEQ) return;
  if(!CUR) return;

  // 级联失效清洗：上游变则下游失效项清除
  const _afterRegion = CUR.dealers.filter(d=>{
    if(SEL_CATS.size    && !passesCapabilityFilter(d))    return false;
    if(SEL_REGIONS.size && !SEL_REGIONS.has(d.r)) return false;
    if(SEL_TIERS.size   && !SEL_TIERS.has(d.lv))  return false;
    return true;
  });
  const _visProv = new Set(_afterRegion.map(d=>stripSuffix(d.p)));
  const _afterProv = _afterRegion.filter(d=>!SEL_PROVS.size || SEL_PROVS.has(stripSuffix(d.p)));
  const _visCitiesRaw = new Set(_afterProv.map(d=>d.c));
  const _visPref = new Set([..._visCitiesRaw].map(c=>COUNTY_PARENT[c]||c));
  for(const p of [...SEL_PROVS])  { if(!_visProv.has(p)) SEL_PROVS.delete(p); }
  for(const c of [...SEL_CITIES]) { if(!_visPref.has(c)) SEL_CITIES.delete(c); }
  if(SEL_CITIES.size!==1){ COUNTY_CHECKED=null; }
  else {
    const _ap=[...SEL_CITIES][0];
    if(!CITY_SUBS[_ap]) COUNTY_CHECKED=null;
    else if(COUNTY_CHECKED){
      const valid = new Set(CITY_SUBS[_ap].filter(c=>_visCitiesRaw.has(c)));
      const kept = new Set([...COUNTY_CHECKED].filter(c=>valid.has(c)));
      COUNTY_CHECKED = kept.size===0 ? null : kept;
    }
  }

  // 网点类型 / 大区 / 城市等级 chips（基于当前期数据）
  renderChipRow('catChips', ['销售','售后'], SEL_CATS);
  const regions = [...new Set(CUR.dealers.map(d=>d.r))].sort();
  renderChipRow('regionChips', regions, SEL_REGIONS);
  renderChipRow('tierChips',   TIERS.filter(t=>CUR.dealers.some(d=>d.lv===t)), SEL_TIERS);
  renderProvChips(_visProv);
  renderCityChips(_visCitiesRaw);

  renderBrandChips();
  updateFilterDDLabels();
  refreshSelectDDs();

  // P043：仅当"对比日期"恰是当前日期的相邻上一期时，懒加载 T-2 启用二期确认口径；
  // 非相邻对比 / 前两期数据不足时 PREV2=null，行为与原口径完全一致。
  PREV2 = null;
  if(PREV){
    const _seq = DATA.snapshots.map(s=>s.ts);
    const _ci = _seq.indexOf(CUR.ts);
    if(_ci >= 2 && _seq[_ci-1] === PREV.ts){
      try{ PREV2 = await ensureSnap(_seq[_ci-2]); }catch(e){ PREV2 = null; }
      if(seq !== RENDER_SEQ) return;
    }
  }

  // KPI + 主体
  const curLocs  = filterAll(CUR.dealers);
  const prevLocs = PREV ? filterAll(PREV.dealers) : [];
  const diff = pairPeriodChanges(curLocs, prevLocs);
  const added = diff.added, removed = diff.removed;
  const conf = PREV2 ? confirmPeriodDiff(diff, curLocs, prevLocs, filterAll(PREV2.dealers)) : null;

  renderKPI(curLocs, prevLocs, added, removed, conf);
  document.getElementById('meta').textContent =
    `共 ${DATA.snapshots.length} 期 · 当前 ${fmtTs(CUR.ts)}` + (PREV?` · 对比 ${fmtTs(PREV.ts)}`:'');

  if(CUR_TAB==='net'){
    // 筛选（网点类型/大区/城市等级/省份/城市/品牌）激活时，趋势折线图需要全部历史期的经销商明细，
    // 而默认只有当前期/对比期会被加载——这里提前把其余期数补拉齐，避免 trendSeriesData() 里
    // 因某期 dealers 未加载而漏算（数据缺口，非报错；trendSeriesData 本身已做兜底不会崩）。
    const filtersActive = SEL_CATS.size || SEL_REGIONS.size || SEL_TIERS.size || SEL_PROVS.size || SEL_CITIES.size || SEL_BRANDS.size;
    if(filtersActive){
      await Promise.all(DATA.snapshots.map(s=>ensureSnap(s.ts).catch(()=>null)));
      if(seq !== RENDER_SEQ) return;
    }
    renderNetTab(curLocs, prevLocs);
  }
  if(CUR_TAB==='map' && mapLoaded) renderMap();
  if(CUR_TAB==='detail') renderDetail(curLocs, added, removed, diff.changed, conf);
  // 城市覆盖率页若正显示，跟随周期重算（本页用全量数据，不受可视化页筛选影响）
  if(document.getElementById('page-penetration').style.display!=='none') renderPenetration();
  if(document.getElementById('page-density').style.display!=='none') renderDensity();
}

function renderChipRow(elId, values, selSet){
  const el = document.getElementById(elId);
  const allActive = selSet.size === 0;
  const items = [`<div class="opt ${allActive?'sel':''}" data-val="__all__"><span class="check"></span><span class="nm">全部</span></div>`];
  for(const v of values){
    const on = selSet.has(v);
    items.push(`<div class="opt ${on?'sel':''}" data-val="${v}"><span class="check"></span><span class="nm">${v}</span></div>`);
  }
  el.innerHTML = `<div class="dd-pop-inner">${items.join('')}</div>`;
  el.querySelectorAll('.opt').forEach(c=>c.onclick=ev=>{
    ev.stopPropagation();
    const v = c.dataset.val;
    if(v==='__all__'){ selSet.clear(); }
    else if(selSet.has(v)){ selSet.delete(v); }
    else { selSet.add(v); }
    render();
  });
}

function renderProvChips(visProvSet){
  const el = document.getElementById('provChips');
  const provs = [...visProvSet].sort();
  const allActive = SEL_PROVS.size === 0;
  const items = [`<div class="opt ${allActive?'sel':''}" data-pv="__all__"><span class="check"></span><span class="nm">全部</span></div>`];

function renderCityChips(visCitiesRaw){
  const visPref = new Set([...visCitiesRaw].map(c=>COUNTY_PARENT[c]||c));
  const prefs = [...visPref].sort((a,b)=>a.localeCompare(b));
  const allSel = SEL_CITIES.size===0;
  const items = [`<div class="opt ${allSel?'sel':''}" data-city="__all__"><span class="check"></span><span class="nm">全部</span></div>`];
  for(const pref of prefs){
    const on = SEL_CITIES.has(pref);
    const subs = (CITY_SUBS[pref]||[]).filter(c=>visCitiesRaw.has(c));
    const hasSub = subs.length>0;
    items.push(`<div class="opt ${on?'sel':''} ${hasSub?'has-sub':''}" data-city="${pref}">
      <span class="check"></span><span class="nm">${pref}</span>
      ${hasSub ? `<span class="sub-toggle" data-toggle="1">▸</span>${renderCitySubPopHtml(pref, subs)}` : ''}
    </div>`);
  }
  document.getElementById('cityChips').innerHTML = `<div class="dd-pop-inner">${items.join('')}</div>`;
  bindCityHandlers();
}

function renderCitySubPopHtml(pref, subs){
  const isOnly = SEL_CITIES.size===1 && SEL_CITIES.has(pref);
  const checked = (isOnly && COUNTY_CHECKED) ? COUNTY_CHECKED : null;
  const allSel = checked===null;
  const allItem = `<div class="opt ${allSel?'sel':''}" data-csub="__all__" data-parent="${pref}"><span class="check"></span><span class="nm">全部</span></div>`;
  const items = subs.map(s=>{
    const on = !allSel && checked.has(s);
    return `<div class="opt ${on?'sel':''}" data-csub="${s}" data-parent="${pref}"><span class="check"></span><span class="nm">${s}</span></div>`;
  }).join('');
  return `<div class="sub-pop">${allItem}${items}</div>`;
}

function bindCityHandlers(){
  const root = document.getElementById('cityChips');
  root.querySelectorAll('[data-city]').forEach(c=>{
    c.onclick = ev=>{
      ev.stopPropagation();
      if(ev.target.closest('[data-toggle]')){
        root.querySelectorAll('.opt.has-sub.expanded').forEach(x=>{ if(x!==c) x.classList.remove('expanded'); });
        c.classList.toggle('expanded');
        if(c.classList.contains('expanded')){
          const toggleBtn = c.querySelector('[data-toggle]');
          const subPop = c.querySelector('.sub-pop');
          if(toggleBtn && subPop){
            const r = toggleBtn.getBoundingClientRect();
            subPop.style.left = (r.right + 6) + 'px';
            subPop.style.top  = r.top + 'px';
            requestAnimationFrame(()=>{
              const h = subPop.offsetHeight;
              const maxTop = window.innerHeight - h - 8;
              if(r.top > maxTop) subPop.style.top = Math.max(8, maxTop) + 'px';
            });
          }
        }
        return;
      }
      const subEl = ev.target.closest('[data-csub]');
      if(subEl){
        const pref = subEl.dataset.parent;
        const s = subEl.dataset.csub;
        if(!(SEL_CITIES.size===1 && SEL_CITIES.has(pref))){
          SEL_CITIES.clear(); SEL_CITIES.add(pref); COUNTY_CHECKED=null;
        }
        if(s==='__all__'){
          COUNTY_CHECKED = null;
        } else {
          const cur = COUNTY_CHECKED ? new Set(COUNTY_CHECKED) : new Set();
          if(cur.size===0)        COUNTY_CHECKED = new Set([s]);
          else if(cur.has(s)){ cur.delete(s); COUNTY_CHECKED = cur.size===0 ? null : cur; }
          else              { cur.add(s);    COUNTY_CHECKED = cur; }
        }
        render();
        return;
      }
      const v = c.dataset.city;
      if(v==='__all__'){ SEL_CITIES.clear(); COUNTY_CHECKED=null; }
      else if(SEL_CITIES.has(v)){
        SEL_CITIES.delete(v);
        if(SEL_CITIES.size!==1) COUNTY_CHECKED=null;
      } else {
        SEL_CITIES.add(v);
        if(SEL_CITIES.size!==1) COUNTY_CHECKED=null;
      }
      render();
    };
  });
}

function renderKPI(curLocs, prevLocs, added, removed, conf){
  const setText=(id,v,d)=>{
    document.getElementById(id).textContent = v;
    const dEl = document.getElementById(id+'D');
    if(d===undefined||d===null){ dEl.textContent=''; return; }
    const cls = d>0?'pos':d<0?'neg':'zero';
    dEl.className='delta '+cls;
    dEl.textContent = (d>0?'+':'')+d;
  };
  const setNote=(id,txt)=>{ const el=document.getElementById(id); el.className='delta zero'; el.textContent=txt; };
  const cityCur = new Set(curLocs.map(l=>l.p+l.c)).size;
  const cityPre = PREV ? new Set(prevLocs.map(l=>l.p+l.c)).size : null;
  const brCur   = new Set(curLocs.map(l=>l.g)).size;
  const brPre   = PREV ? new Set(prevLocs.map(l=>l.g)).size : null;
  setText('kTotal', curLocs.length, PREV?curLocs.length-prevLocs.length:null);
  if(conf){
    // P043 二期确认口径：新增/退出用确认数，观察中/回归以小字提示
    setText('kAdd', conf.counts.added, null);
    setNote('kAddD', conf.counts.ret ? `回归 ${conf.counts.ret} 家不计` : '');
    setText('kDel', conf.counts.removed, null);
    setNote('kDelD', conf.counts.obs ? `另有 ${conf.counts.obs} 家观察中` : '');
  }else{
    setText('kAdd',   PREV?added.length:'-',   null);
    setText('kDel',   PREV?removed.length:'-', null);
  }
  setText('kCity',  cityCur, PREV?cityCur-cityPre:null);
  setText('kBrand', brCur,   PREV?brCur-brPre:null);
}

/* ============ 趋势折线（跨品牌） ============ */
const trendGroupKey = g => `g:${g}`;
const trendSubKey = (g,s) => `s:${g}:${s}`;
function trendKeyLabel(k){
  if(k.startsWith('g:')) return k.slice(2);
  const [,g,s] = k.split(':');
  return `${g}·${s}`;
}
function trendKeyCount(last, k){ return last[k] || 0; }
function trendBrandParts(d){
  const raw = d.g || '';
  const mapped = TREND_CHILD_TO_GROUP[raw];
  if(mapped) return {group:mapped, sub:raw};
  if(GROUP_SUBS[raw]){
    const subs = d.subs || new Set([d.b].filter(Boolean));
    return {group:raw, subs};
  }
  return {group:raw, subs:new Set()};
}

// 计算每期每品牌/子品牌的 location 数（受全局筛选 cat/region/tier + SEL_BRANDS 影响）
function trendSeriesData(){
  const noFilters = !SEL_CATS.size && !SEL_REGIONS.size && !SEL_TIERS.size && !SEL_PROVS.size && !SEL_CITIES.size && !SEL_BRANDS.size;
  if(noFilters && DATA.snapshots.every(s=>s.trendCounts)){
    return DATA.snapshots.map(s=>({ts:s.ts, counts:s.trendCounts || {}}));
  }
  return DATA.snapshots.map(s=>{
    // 历史期 dealers 是懒加载的（仅当前期/对比期保证已加载）；筛选激活时 renderNetTab 会提前
    // 预拉全部期数，但这里仍做兜底——未加载完成前该期先按 0 处理，不让整个趋势计算崩溃。
    if(!s.dealers) return {ts:s.ts, counts:{}};
    let list = filterGlobal(s.dealers);
    if(SEL_BRANDS.size) list = list.filter(d=>SEL_BRANDS.has(d.g));
    const locs = buildLocations(list);
    const counts = {};
    for(const l of locs){
      const parts = trendBrandParts(l);
      if(!parts.group) continue;
      const gk = trendGroupKey(parts.group);
      counts[gk] = (counts[gk] || 0) + 1;
      const subs = parts.sub ? new Set([parts.sub]) : (parts.subs || new Set());
      if(GROUP_SUBS[parts.group]){
        for(const sub of subs){
          if(GROUP_SUBS[parts.group].includes(sub)){
            const sk = trendSubKey(parts.group, sub);
            counts[sk] = (counts[sk] || 0) + 1;
          }
        }
      }
    }
    return {ts:s.ts, counts};
  });
}

// 趋势图"统计维度=月度"：每个自然月取最后一期快照作为该月代表点（sd 按时间升序，故同月内后出现的覆盖先出现的）。
function monthlyFilterSD(sd){
  const lastByMonth = {};
  for(const s of sd) lastByMonth[s.ts.slice(0,6)] = s;
  return Object.values(lastByMonth);
}

// 高区分度调色板，用于趋势线和下拉色点保持一致。
const TREND_PALETTE = ['#2563eb','#dc2626','#16a34a','#9333ea','#ea580c',
                       '#0891b2','#ca8a04','#db2777','#4f46e5','#059669',
                       '#b91c1c','#7c3aed','#0f766e','#d97706','#0284c7',
                       '#be123c','#65a30d','#6d28d9','#0e7490','#a16207',
                       '#1d4ed8','#991b1b','#15803d','#86198f'];

// 品牌配色排序用的数据源：故意不走 trendSeriesData() 的筛选分支——配色应该保持稳定，
// 不该跟着当前筛选（网点类型/大区/…）变化，也不能因为触发历史期 dealers 懒加载而有崩溃风险。
// 优先用预计算的 trendCounts（全期数都有，覆盖所有 17 个品牌）；缺失时兜底用已加载过的期数据。
function trendSeriesDataForColor(){
  if(DATA.snapshots.every(s=>s.trendCounts)){
    return DATA.snapshots.map(s=>({ts:s.ts, counts:s.trendCounts || {}}));
  }
  const loaded = DATA.snapshots.filter(s=>s.dealers);
  if(!loaded.length) return [{ts:'', counts:{}}];
  return loaded.map(s=>{
    const locs = buildLocations(s.dealers);
    const counts = {};
    for(const l of locs){
      const parts = trendBrandParts(l);
      if(!parts.group) continue;
      const gk = trendGroupKey(parts.group);
      counts[gk] = (counts[gk] || 0) + 1;
    }
    return {ts:s.ts, counts};
  });
}

// 品牌 -> 趋势线颜色的稳定映射（按当前网点数降序排列，与 renderTrend 内部排序算法保持一致），
// 供柱状图（renderNet）复用，确保两个图表里同一品牌的颜色一致。
function trendGroupKeysOrdered(){
  const sd = trendSeriesDataForColor();
  const last = sd.at(-1).counts;
  const allKeys = new Set();
  sd.forEach(s => Object.keys(s.counts).forEach(k => allKeys.add(k)));
  return [...allKeys].filter(k=>k.startsWith('g:')).sort((a,b)=>trendKeyCount(last,b)-trendKeyCount(last,a));
}
function trendGroupColorOf(name){
  const keys = trendGroupKeysOrdered();
  const i = keys.indexOf(trendGroupKey(name));
  return TREND_PALETTE[(i<0?0:i) % TREND_PALETTE.length];
}

function defaultTrendSelection(groupKeys){
  const porscheIdx = groupKeys.indexOf(trendGroupKey('保时捷'));
  const end = porscheIdx >= 0 ? porscheIdx + 1 : Math.min(12, groupKeys.length);
  return new Set(groupKeys.slice(0, end));
}
function trendQuickSelection(kind, groupKeys){
  if(kind==='default') return defaultTrendSelection(groupKeys);
  if(kind==='all') return new Set(groupKeys);
  if(kind==='luxury' || kind==='super'){
    const names = TREND_QUICK_DEFS[kind].brands || [];
    return new Set(groupKeys.filter(k=>names.includes(trendKeyLabel(k))));
  }
  if(kind==='ev'){
    const luxury = new Set(TREND_QUICK_DEFS.luxury.brands);
    const sup = new Set(TREND_QUICK_DEFS.super.brands);
    return new Set(groupKeys.filter(k=>{
      const g = trendKeyLabel(k);
      return !luxury.has(g) && !sup.has(g);
    }));
  }
  return new Set();
}

function syncTrendLabel(allKeys){
  const el = document.getElementById('ddTrend');
  if(!el) return;
  const n = TREND_SELECTED ? TREND_SELECTED.size : 0;
  if(TREND_QUICK && n){
    el.textContent = TREND_QUICK_DEFS[TREND_QUICK]?.label || `已选 ${n}`;
    return;
  }
  const topKeys = allKeys.filter(k=>k.startsWith('g:'));
  const allTop = topKeys.length && topKeys.every(k=>TREND_SELECTED.has(k)) && TREND_SELECTED.size===topKeys.length;
  el.textContent = allTop ? '全部' : n ? `已选 ${n}` : '未选择';
}

function renderTrend(){
  let sd = trendSeriesData();
  if(TREND_PERIOD === 'month') sd = monthlyFilterSD(sd);
  const last = sd.at(-1).counts;
  const allKeys = new Set();
  sd.forEach(s => Object.keys(s.counts).forEach(k => allKeys.add(k)));
  const groupKeys = [...allKeys].filter(k=>k.startsWith('g:')).sort((a,b)=>trendKeyCount(last,b)-trendKeyCount(last,a));
  const subKeysByGroup = {};
  for(const gk of groupKeys){
    const g = trendKeyLabel(gk);
    if(GROUP_SUBS[g]){
      subKeysByGroup[g] = GROUP_SUBS[g]
        .map(s=>trendSubKey(g,s))
        .filter(k=>allKeys.has(k))
        .sort((a,b)=>trendKeyCount(last,b)-trendKeyCount(last,a));
    }
  }
  const orderedKeys = [...groupKeys];
  for(const gk of groupKeys){
    const g = trendKeyLabel(gk);
    if(subKeysByGroup[g]) orderedKeys.push(...subKeysByGroup[g]);
  }

  // 默认: 按当前网点数排序，选到“保时捷”为止；保时捷之后的超豪华默认不选。
  if(!TREND_SELECTED){
    TREND_QUICK = 'default';
    TREND_SELECTED = trendQuickSelection('default', groupKeys);
  } else {
    TREND_SELECTED = new Set([...TREND_SELECTED].filter(k=>orderedKeys.includes(k)));
  }
  const colorOf = k => TREND_PALETTE[orderedKeys.indexOf(k) % TREND_PALETTE.length];

  // 下拉多选列表
  const chipsEl = document.getElementById('trendChips');
  const quickItems = Object.entries(TREND_QUICK_DEFS).map(([key, def]) =>
    `<div class="opt quick ${TREND_QUICK===key?'sel':''}" data-tquick="${key}"><span class="check"></span><span class="nm">${def.label}</span></div>`
  );
  const items = [...quickItems];
  for(const gk of groupKeys){
    const g = trendKeyLabel(gk);
    const on = TREND_SELECTED.has(gk);
    const dot = `<span class="dot" style="width:9px;height:9px;border-radius:2.5px;background:${on?colorOf(gk):'#d1d5da'};flex-shrink:0"></span>`;
    const subs = subKeysByGroup[g] || [];
    items.push(`<div class="opt ${on?'sel':''} ${subs.length?'has-sub':''}" data-tb="${gk}">
      <span class="check"></span>${dot}<span class="nm">${g}</span>
      ${subs.length ? `<span class="sub-toggle" data-toggle="1">▸</span>${renderTrendSubPopHtml(g, subs, last, colorOf)}` : ''}
    </div>`);
  }
  chipsEl.innerHTML = `<div class="dd-pop-inner">${items.join('')}</div>`;
  bindTrendHandlers(groupKeys, last, colorOf);
  syncTrendLabel(orderedKeys);
  renderTrendPeriodChips();

  const xs = TREND_PERIOD === 'month' ? sd.map(s => `${s.ts.slice(0,4)}/${s.ts.slice(4,6)}`) : sd.map(s => fmtTs(s.ts));
  const selectedKeys = orderedKeys.filter(k=>TREND_SELECTED.has(k));
  const series = selectedKeys.map(k => ({
    name: trendKeyLabel(k), type: 'line', smooth: true, symbol: 'circle', symbolSize: 7,
    lineStyle: {width: 2, color: colorOf(k)},
    itemStyle: {color: colorOf(k)},
    data: sd.map(s => s.counts[k] || 0),
    emphasis: {focus: 'series', lineStyle:{width:3}},
  }));

  trendChart.setOption({
    backgroundColor: 'transparent',
    grid: {left: 56, right: 30, top: 16, bottom: 36},
    tooltip: {trigger: 'axis', order: 'valueDesc',
      // appendToBody: 挂到 .body（有 overflow-y:auto）内部时，靠近图表顶部悬停会因为祖先裁剪
      // 把最上面几个品牌的行截没（实测复现）；挂到 body 上脱离裁剪祖先，靠 confine 保持不出视口。
      appendToBody: true, confine: true,
      position: (point, _params, _dom, _rect, size) => [point[0]+12, point[1]-size.contentSize[1]/2],
      formatter: params => {
        if(!params.length) return '';
        const idx = params[0].dataIndex;
        const ts = params[0].axisValueLabel;
        const hoverKey = TREND_HOVER_KEY;
        // 全部选中品牌都照常显示；只有鼠标真正压在某条线（原生 emphasis 命中，与线本身变粗同一判定）上时，
        // 对应行才加淡蓝色圆角高光背景；鼠标在线与线之间的空白处不高亮任何一行。
        // 排版：方形色点 + 品牌名(flex:1) + 数值/涨跌右对齐成列。
        const rows = params.slice().sort((a,b)=>b.value-a.value).map(p => {
          const cur = p.value;
          const key = selectedKeys.find(k=>trendKeyLabel(k)===p.seriesName);
          const prev = idx>0 && key ? sd[idx-1].counts[key] || 0 : null;
          let pct = '';
          if(prev !== null){
            const d = cur - prev;
            const pctVal = prev>0 ? (d/prev*100) : (d>0?100:0);
            const sign = d>0?'+':'';
            const color = d>0?'#1a7f37':d<0?'#cf222e':'#8c959f';
            pct = `<span style="color:${color};margin-left:2px">（${sign}${d} / ${sign}${pctVal.toFixed(1)}%）</span>`;
          }
          const hl = p.seriesName === hoverKey;
          const dot = `<span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${p.color};flex-shrink:0"></span>`;
          return `<div style="display:flex;align-items:center;gap:6px;padding:3px 7px;border-radius:6px;margin:1px 0${hl?';background:#e8f1ff':''}">`
            + dot
            + `<span style="flex:1;white-space:nowrap${hl?';font-weight:600':''}">${p.seriesName}</span>`
            + `<b>${cur}</b>${pct}</div>`;
        }).join('');
        return `<div style="min-width:240px"><div style="font-weight:600;margin-bottom:6px;padding:0 7px">${ts}</div>${rows}</div>`;
      }
    },
    xAxis: {type: 'category', data: xs, boundaryGap: false, axisLabel: {fontSize: 13, color:'#24292f'},
            axisLine:{lineStyle:{color:'#d1d5da'}}},
    yAxis: {type: 'value', axisLabel: {fontSize: 13, color:'#24292f'},
            splitLine: {lineStyle: {color: '#e1e4e8'}},
            min: v => Math.max(0, Math.floor((v.min - (v.max - v.min) * 0.15) / 10) * 10),
            max: v => Math.ceil(v.max * 1.03 / 50) * 50},
    series
  }, true);

  // 高亮判定：原生 mouseover 只在精确命中数据点/线条描边(几像素宽)时触发，两点之间的线段大概率打不中，
  // 表现为"只有三个节点会高亮"。改用 zrender 的连续 mousemove，在当前鼠标 x 对应的两个相邻数据点之间
  // 按比例插值算出每条线在该 x 处的像素 y，取离鼠标 y 最近且在阈值内的一条——这样线上任意位置都能高亮，
  // 同时线与线之间的空白仍然不会误触发（阈值之外直接判 null）。
  const zr = trendChart.getZr();
  if(TREND_ZR_MOUSEMOVE) zr.off('mousemove', TREND_ZR_MOUSEMOVE);
  if(TREND_ZR_GLOBALOUT) zr.off('globalout', TREND_ZR_GLOBALOUT);
  const n = sd.length;
  TREND_ZR_MOUSEMOVE = e => {
    if(n < 2){ TREND_HOVER_KEY = null; return; }
    const x0 = trendChart.convertToPixel({xAxisIndex:0}, 0);
    const x1 = trendChart.convertToPixel({xAxisIndex:0}, n-1);
    const fracIdx = (e.offsetX - x0) / (x1 - x0) * (n-1);
    if(fracIdx < 0 || fracIdx > n-1){ TREND_HOVER_KEY = null; return; }
    const idxFloor = Math.max(0, Math.min(n-2, Math.floor(fracIdx)));
    const idxCeil = idxFloor + 1;
    const t = fracIdx - idxFloor;
    let best = Infinity, bestKey = null;
    series.forEach((s, i) => {
      const yFloor = trendChart.convertToPixel({seriesIndex:i}, [idxFloor, s.data[idxFloor]])[1];
      const yCeil = trendChart.convertToPixel({seriesIndex:i}, [idxCeil, s.data[idxCeil]])[1];
      const yInterp = yFloor + (yCeil - yFloor) * t;
      const dist = Math.abs(e.offsetY - yInterp);
      if(dist < best){ best = dist; bestKey = s.name; }
    });
    TREND_HOVER_KEY = best <= 12 ? bestKey : null;
  };
  TREND_ZR_GLOBALOUT = () => { TREND_HOVER_KEY = null; };
  zr.on('mousemove', TREND_ZR_MOUSEMOVE);
  zr.on('globalout', TREND_ZR_GLOBALOUT);

  trendChart.resize();
}

const TREND_PERIOD_DEFS = [{key:'week', label:'周度'}, {key:'month', label:'月度'}];
function renderTrendPeriodChips(){
  document.getElementById('ddTrendPeriod').textContent = TREND_PERIOD_DEFS.find(d=>d.key===TREND_PERIOD).label;
  const el = document.getElementById('trendPeriodChips');
  el.innerHTML = `<div class="dd-pop-inner">${TREND_PERIOD_DEFS.map(d =>
    `<div class="opt ${TREND_PERIOD===d.key?'sel':''}" data-tperiod="${d.key}"><span class="check"></span><span class="nm">${d.label}</span></div>`
